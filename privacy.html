<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0F0A08">
<title>Privacy · الخصوصية · Integritet</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0A08;--card:#1A1410;--text:#F5F5F5;--text2:#D0D0D0;--gold:#D4AF37;--border:rgba(255,255,255,.14)}
@media(prefers-color-scheme:light){:root{--bg:#FAF6EE;--card:#fff;--text:#1A1410;--text2:#3A3025;--gold:#8B7524;--border:rgba(0,0,0,.18)}}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:1rem/1.8 'IBM Plex Sans Arabic',system-ui,sans-serif;padding:calc(20px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom))}
main{max-width:680px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
a{color:var(--gold);text-decoration:none}
#back{padding:10px 4px;font-weight:500}
.langs{display:flex;gap:8px}
.langs button{padding:8px 16px;border-radius:999px;border:1px solid var(--border);color:var(--text2);background:none;font:inherit;font-size:.9rem;cursor:pointer}
.langs button.on{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:500}
h1{font:600 1.9rem 'Reem Kufi',sans-serif;color:var(--gold);margin-bottom:4px}
.up{color:var(--text2);font-size:.9rem;margin-bottom:26px}
section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 18px 8px;margin-bottom:14px}
h2{font:500 1.2rem 'Reem Kufi',sans-serif;color:var(--gold);margin-bottom:8px}
p{color:var(--text2);margin-bottom:12px}
</style>
</head>
<body>
<main>
  <div class="top"><a id="back" href="./index.html"></a><div class="langs" id="langs"></div></div>
  <h1 id="title"></h1>
  <div class="up" id="upd"></div>
  <div id="body"></div>
</main>
<script>
const L={
ar:{n:'العربية',t:'سياسة الخصوصية',u:'آخر تحديث: 3 أكتوبر 2026',b:'← العودة للتطبيق',s:[
['الخلاصة','«لحظة» تطبيق يوميات خاص. كل ما تكتبه وتصوّره وتسجّله بصوتك يبقى على جهازك فقط. لا نملك خوادم لتخزين لقطاتك، ولا نطلب منك حساباً، ولا نرى بياناتك.'],
['ما الذي يُحفظ على جهازك','لقطاتك (صور، فيديوهات، تسجيلات صوتية، نصوص، أجوبة، تعليقات، وسوم، تاريخ ومزاج) وإعداداتك (اللغة، المظهر، حجم الخط، ووقت التذكير). تُخزَّن داخل التطبيق على جهازك، وتُحذف عند حذف التطبيق أو عند استخدام «حذف كل اللقطات» من الإعدادات.'],
['ما الذي لا نفعله','لا نجمع بيانات شخصية. لا نستخدم أدوات تحليل أو تتبع. لا نعرض إعلانات. لا نبيع بياناتك ولا نشاركها نحن مع أي جهة. المشاركة الوحيدة هي التي تبدأها أنت بنفسك (انظر بند المشاركة).'],
['المشاركة','يمكنك مشاركة لقطة (صورة أو عدة صور أو فيديو أو تسجيل صوتي أو نص أو جواب) مع أشخاص آخرين عبر قائمة المشاركة في نظام iOS. تبدأ المشاركة بقرارك وحدك، وتنتقل اللقطة مباشرة من جهازك إلى التطبيق أو الشخص الذي تختاره (مثل الرسائل أو واتساب أو البريد)، دون أن تمر بأي خادم تابع لنا ودون أن نحتفظ بنسخة منها.\nعند مشاركة نص أو جواب كصورة يُنشأ شكل الصورة على جهازك مؤقتاً، وتحمل اسم التطبيق في أسفلها.\nبعد المشاركة تخضع النسخة التي استلمها الطرف الآخر لسياسة التطبيق الذي اخترته وليس لسياستنا، فاختر بعناية ما تشاركه ومع من. لا نضيف أي رابط تتبع أو معرّف إلى ما تشاركه.'],
['الأذونات','الكاميرا: لالتقاط الصور وتسجيل الفيديو داخل التطبيق فقط.\nالميكروفون: لتسجيل الملاحظات الصوتية عندما تضغط زر التسجيل فقط. لا يعمل الميكروفون في الخلفية، ولا تُرسل التسجيلات إلى أي جهة، وتبقى على جهازك.\nالصور والملفات: لاختيار صور من معرض جهازك، أو خلفية للنص، أو فيديو.\nالإشعارات: لتذكيرك اليومي في الوقت الذي تحدده.\nيمكنك سحب أي إذن من إعدادات جهازك في أي وقت.'],
['النسخ الاحتياطية','تُنشأ النسخة بطلبك وتُحفظ في المكان الذي تختاره (مثل ملفات iCloud). هي ملفك وتحت مسؤوليتك، فلا نملك نسخة منها ولا نستطيع استرجاع بياناتك إذا فُقدت.'],
['خدمات خارجية','عند الاتصال بالإنترنت قد يحمّل التطبيق خطوطاً من Google Fonts، وبذلك يستلم خادم Google عنوان IP الخاص بجهازك كأي موقع ويب. لا تُرسل لقطاتك إلى أي خدمة.'],
['التواصل بالبريد','إذا راسلتنا من «تواصل معنا» فنستلم بريدك ورسالتك فقط، ونستخدمهما للرد عليك.'],
['الأطفال','التطبيق غير موجّه للأطفال دون 13 عاماً، ولا نجمع بيانات من أي مستخدم.'],
['التغييرات','قد نحدّث هذه السياسة، وسيظهر تاريخ آخر تحديث أعلى الصفحة.'],
['تواصل معنا','لأي سؤال عن الخصوصية: lahzalaqta@gmail.com']]},
en:{n:'English',t:'Privacy Policy',u:'Last updated: October 3, 2026',b:'← Back to app',s:[
['Summary','Lahza is a private journal app. Everything you write, capture and record with your voice stays on your device only. We run no servers that store your moments, we do not ask for an account, and we cannot see your data.'],
['What is stored on your device','Your moments (photos, videos, voice recordings, texts, answers, captions, tags, dates and mood) and your settings (language, appearance, text size and reminder time). It is stored inside the app on your device and is removed when you delete the app or use "Delete all moments" in Settings.'],
['What we do not do','We do not collect personal data. We use no analytics or tracking tools. We show no ads. We do not sell your data and we do not share it with anyone. The only sharing is what you start yourself (see the Sharing section).'],
['Sharing','You can share a moment (photo, several photos, video, voice recording, text or answer) with other people through the iOS share sheet. Sharing starts only by your decision, and the moment goes directly from your device to the app or person you choose (such as Messages, WhatsApp or Mail), without passing through any server of ours and without us keeping a copy.\nWhen you share a text or answer as an image, the image is created temporarily on your device and carries the app name at the bottom.\nAfter sharing, the copy received by the other party is governed by the privacy policy of the app you chose, not ours, so choose carefully what you share and with whom. We add no tracking link or identifier to what you share.'],
['Permissions','Camera: to take photos and record video inside the app only.\nMicrophone: to record voice notes only while you press the record button. The microphone never runs in the background, and recordings are not sent anywhere; they stay on your device.\nPhotos and files: to pick photos from your library, a text background, or a video.\nNotifications: to send your daily reminder at the time you choose.\nYou can revoke any permission in your device settings at any time.'],
['Backups','A backup is created when you ask for it and saved where you choose (for example Files or iCloud). It is your file and your responsibility. We hold no copy and cannot recover your data if it is lost.'],
['Third-party services','When online, the app may load fonts from Google Fonts, so Google\'s server receives your device\'s IP address as any website would. Your moments are never sent to any service.'],
['Contacting us by email','If you write to us from "Contact & feedback", we receive only your email address and message, and use them to reply to you.'],
['Children','The app is not directed at children under 13, and we do not collect data from any user.'],
['Changes','We may update this policy. The last-updated date at the top will change accordingly.'],
['Contact','Questions about privacy: lahzalaqta@gmail.com']]},
sv:{n:'Svenska',t:'Integritetspolicy',u:'Senast uppdaterad: 3 oktober 2026',b:'← Tillbaka till appen',s:[
['Sammanfattning','Lahza är en privat dagboksapp. Allt du skriver, fotograferar och spelar in med din röst stannar enbart på din enhet. Vi har inga servrar som lagrar dina ögonblick, vi kräver inget konto och vi kan inte se dina data.'],
['Vad som lagras på din enhet','Dina ögonblick (foton, videor, röstinspelningar, texter, svar, bildtexter, taggar, datum och humör) och dina inställningar (språk, utseende, textstorlek och påminnelsetid). Det lagras i appen på din enhet och tas bort när du raderar appen eller använder "Radera alla ögonblick" i Inställningar.'],
['Vad vi inte gör','Vi samlar inte in personuppgifter. Vi använder inga analys- eller spårningsverktyg. Vi visar ingen reklam. Vi säljer inte dina data och delar dem inte med någon. Den enda delningen är den du själv startar (se avsnittet Delning).'],
['Delning','Du kan dela ett ögonblick (foto, flera foton, video, röstinspelning, text eller svar) med andra via iOS delningsmeny. Delning startar bara på ditt eget beslut, och ögonblicket går direkt från din enhet till den app eller person du väljer (som Meddelanden, WhatsApp eller Mail), utan att passera någon server hos oss och utan att vi behåller en kopia.\nNär du delar en text eller ett svar som bild skapas bilden tillfälligt på din enhet och har appens namn längst ned.\nEfter delning gäller den mottagna kopian enligt integritetspolicyn för den app du valt, inte vår, så välj noga vad du delar och med vem. Vi lägger inte till någon spårningslänk eller identifierare i det du delar.'],
['Behörigheter','Kamera: för att ta foton och spela in video endast i appen.\nMikrofon: för att spela in röstanteckningar endast medan du trycker på inspelningsknappen. Mikrofonen körs aldrig i bakgrunden och inspelningar skickas inte någonstans; de stannar på din enhet.\nFoton och filer: för att välja foton från ditt bibliotek, en textbakgrund eller en video.\nAviseringar: för att skicka din dagliga påminnelse vid den tid du väljer.\nDu kan när som helst återkalla en behörighet i enhetens inställningar.'],
['Backuper','En backup skapas när du ber om den och sparas där du väljer (till exempel Filer eller iCloud). Det är din fil och ditt ansvar. Vi har ingen kopia och kan inte återställa dina data om de går förlorade.'],
['Tredjepartstjänster','När du är online kan appen hämta typsnitt från Google Fonts, så Googles server får enhetens IP-adress, som vilken webbplats som helst. Dina ögonblick skickas aldrig till någon tjänst.'],
['Kontakt via e-post','Om du skriver till oss via "Kontakt och feedback" får vi bara din e-postadress och ditt meddelande, och använder dem för att svara dig.'],
['Barn','Appen riktar sig inte till barn under 13 år och vi samlar inte in data från någon användare.'],
['Ändringar','Vi kan uppdatera policyn. Datumet för senaste uppdatering högst upp ändras då.'],
['Kontakt','Frågor om integritet: lahzalaqta@gmail.com']]}
};
function $(id){return document.getElementById(id)}
var lang=null;
try{lang=localStorage.getItem('lahza-lang')}catch(e){}
if(!L[lang]){var n=(navigator.language||'ar').slice(0,2);lang=L[n]?n:'ar'}
function render(){
  var d=L[lang];
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.title=d.t;$('title').textContent=d.t;$('upd').textContent=d.u;$('back').textContent=d.b;
  $('langs').innerHTML='';
  Object.keys(L).forEach(function(k){var b=document.createElement('button');b.textContent=L[k].n;b.className=k===lang?'on':'';b.onclick=function(){lang=k;render()};$('langs').appendChild(b)});
  var box=$('body');box.innerHTML='';
  d.s.forEach(function(s){var sec=document.createElement('section'),h=document.createElement('h2');h.textContent=s[0];sec.appendChild(h);
    s[1].split('\n').forEach(function(line){var p=document.createElement('p');
      if(line.indexOf('lahzalaqta')>-1){var i=line.indexOf('lahzalaqta');p.appendChild(document.createTextNode(line.slice(0,i)));var a=document.createElement('a');a.href='mailto:lahzalaqta@gmail.com';a.textContent='lahzalaqta@gmail.com';p.appendChild(a)}
      else p.textContent=line;sec.appendChild(p)});
    box.appendChild(sec)});
}
$('back').addEventListener('click',function(e){
  if(document.referrer&&document.referrer.indexOf(location.host)>-1&&history.length>1){e.preventDefault();history.back()}
});
render();
</script>
</body>
</html>
