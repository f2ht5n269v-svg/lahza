<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0F0A08">
<title>لحظة</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Amiri:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0A08;--card:#1A1410;--card-hover:#221A15;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.18);--gold:#D4AF37;--gold-light:#F4D98C;--gold-soft:rgba(212,175,55,.12);--on-gold:#0F0A08;--text:#F5F5F5;--text-2:#D0D0D0;--text-3:#A8A8A8;--text-4:#8A8A8A;--nav:rgba(15,10,8,.94);--veil:rgba(0,0,0,.96);--splash:radial-gradient(ellipse at center,#1F1508 0%,#0F0A08 65%);--grad:linear-gradient(135deg,#1F1508,#0F0A08);--shadow:0 4px 20px rgba(0,0,0,.5);--r:14px;--fd:'Reem Kufi',sans-serif;--fb:'IBM Plex Sans Arabic',sans-serif;--fq:'Amiri',serif}
:root[data-theme=light]{--bg:#FAF6EE;--card:#FFF;--card-hover:#F5F0E4;--border:rgba(0,0,0,.1);--border-strong:rgba(0,0,0,.2);--gold:#8B7524;--gold-light:#6A5820;--gold-soft:rgba(139,117,36,.12);--on-gold:#fff;--text:#1A1410;--text-2:#3A3025;--text-3:#5A5045;--text-4:#756B60;--nav:rgba(250,246,238,.95);--veil:rgba(250,246,238,.97);--splash:radial-gradient(ellipse at center,#FFF8E6 0%,#FAF6EE 65%);--grad:linear-gradient(135deg,#3a2a12,#1a1410);--shadow:0 4px 20px rgba(0,0,0,.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px;height:100%;-webkit-text-size-adjust:100%}
html,body{overflow:hidden;background:var(--bg)}
body{height:100%;color:var(--text);font:1rem/1.65 var(--fb);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:var(--fb);font-size:1rem;outline:none;border:none;background:none;color:inherit}
textarea{resize:none}img{display:block;max-width:100%}a{text-decoration:none;color:inherit}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.04);opacity:.92}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.content{flex:1;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top)) 16px 120px;animation:fi .3s}
.content::-webkit-scrollbar{display:none}
.page-title{font:600 1.7rem var(--fd);text-align:center;margin-bottom:20px;padding-bottom:8px;position:relative}
.page-title::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:40px;height:2px;background:var(--gold);opacity:.6}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--nav);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:100}
.tab{flex:1;padding:12px 0 10px;font-size:.8rem;font-weight:500;color:var(--text-4);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.tab svg{width:24px;height:24px;stroke-width:1.8}
.tab.active{color:var(--gold)}
.tab::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%) scaleX(0);width:28px;height:2px;background:var(--gold);transition:transform .3s}
.tab.active::after{transform:translateX(-50%) scaleX(1)}
#splash{position:fixed;inset:0;background:var(--splash);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .8s;pointer-events:none}
#splash.hide{opacity:0}
.splash-logo{font:400 5rem/1 'Great Vibes',cursive;color:var(--gold);animation:pulse 2.4s infinite}
.splash-sub{color:var(--gold);font:1.2rem var(--fq);margin-top:16px}
.home-greeting{font:400 1.25rem var(--fd);color:var(--text-2)}
.home-date{font-size:.95rem;color:var(--text-3);margin-bottom:6px}
.home-hijri{font:.95rem var(--fd);color:var(--gold);margin-bottom:28px}
.quote-card{display:flex;justify-content:center;padding:30px 24px;margin:28px auto;max-width:360px;background:var(--card);border:1.5px solid var(--gold);border-radius:20px;cursor:pointer;box-shadow:0 8px 32px var(--gold-soft)}
.quote-card-title{font:600 1.5rem var(--fd);color:var(--gold)}
.home-action{display:flex;align-items:center;gap:16px;padding:16px 8px;border-bottom:1px solid var(--border);font-size:1.1rem;width:100%;text-align:start}
.home-action:last-child{border:none}
.home-action:active{background:var(--gold-soft)}
.home-action svg,.settings-item .icon svg{width:24px;height:24px;stroke:var(--gold);stroke-width:1.8;fill:none}
.home-action .label{flex:1}
.arrow{color:var(--text-4);font-family:var(--fq);font-size:1.2rem}
.on-this-day{margin:24px auto;max-width:360px;padding:16px;background:var(--card);border:1px solid var(--border-strong);border-radius:var(--r)}
.on-this-day-title{font:1rem var(--fd);color:var(--gold);text-align:center;margin-bottom:8px}
.on-this-day-year{display:flex;justify-content:space-between;padding:10px 16px;margin:4px 0;border:1px solid var(--border);border-radius:10px;width:100%}
.on-this-day-count{font-size:.88rem;color:var(--text-3)}
.home-stats{margin-top:28px;display:flex;gap:32px;justify-content:center;padding:16px 0;border-block:1px solid var(--border);width:100%;color:var(--text-3)}
.home-stat{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:80px}
.home-stat .num{color:var(--text);font:600 1.6rem/1 var(--fd)}
.home-stat .lbl{font-size:.85rem;color:var(--text-3)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .3s}
.sheet-content{width:100%;max-width:480px;background:var(--card);border-radius:28px;border:1px solid var(--border-strong);padding:24px 16px;max-height:85vh;overflow-y:auto;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.6);text-align:center}
.xbtn{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--border-strong);color:var(--text);font-size:1.15rem;display:flex;align-items:center;justify-content:center}
.xbtn:active{color:var(--gold);border-color:var(--gold)}
.sheet-close{position:absolute;top:12px;left:12px;z-index:10}
.btn-close,.modal-close{position:fixed;top:calc(16px + env(safe-area-inset-top));left:16px;z-index:410}
#sectionList{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:28px 0 8px}
#questionList{display:flex;flex-direction:column;gap:10px;padding:16px 0 8px}
.section-item,.question-item{border:1.5px solid var(--border-strong);border-radius:var(--r);background:var(--bg);color:var(--text);padding:16px 8px;min-height:60px}
.section-item{font:500 1.1rem var(--fd)}
.question-item{font:1.1rem/1.7 var(--fq);text-align:start;padding:16px}
.section-item:hover,.question-item:hover{border-color:var(--gold);color:var(--gold)}
.btn{display:block;width:100%;max-width:360px;margin:10px auto;padding:16px;border:1px solid var(--border-strong);border-radius:999px;font-weight:500;font-size:1.05rem;text-align:center}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:600}
.btn.small{padding:12px;font-size:.95rem;max-width:240px}
.screen{position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;padding:calc(84px + env(safe-area-inset-top)) 16px 120px;animation:fi .3s}
.screen-title{font:500 1.6rem var(--fd);text-align:center;margin-bottom:24px}
.screen-subtitle{text-align:center;color:var(--text-3);font-size:.95rem;margin-bottom:20px}
.camera-video{width:100%;max-width:400px;margin:0 auto 16px;border-radius:var(--r);display:block;background:#000;aspect-ratio:3/4;object-fit:cover}
.camera-actions{display:flex;gap:16px;justify-content:center;align-items:center}
.capture-btn{width:76px;height:76px;border-radius:50%;background:var(--gold);border:4px solid var(--border-strong)}
.capture-btn:active{transform:scale(.92)}
.switch-cam{width:52px;height:52px;border-radius:50%;border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center}
.text-input,.answer-input,.search{width:100%;max-width:500px;margin:0 auto 16px;background:var(--card);border:1px solid var(--border-strong);border-radius:var(--r);padding:20px;font:1.15rem/1.9 var(--fq);display:block}
.text-input,.answer-input{min-height:220px}
.search{border-radius:999px;padding:12px 20px;font:1rem var(--fb);max-width:none;margin-bottom:14px}
.text-input:focus,.answer-input:focus,.search:focus{border-color:var(--gold)}
::placeholder{color:var(--text-4);font-family:var(--fb);font-size:1rem}
.background-section{max-width:500px;margin:0 auto 16px}
.background-title{font:.95rem var(--fd);color:var(--text-3);display:block;margin-bottom:8px}
.background-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.bg-option{aspect-ratio:1;border-radius:50%;border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--card);color:var(--text-3);cursor:pointer}
.bg-option img{width:100%;height:100%;object-fit:cover}
.bg-option.active{border-color:var(--gold)}
.bg-option.upload{border-style:dashed;color:var(--gold);font-size:1.6rem}
.moods{display:flex;justify-content:center;gap:10px;margin:8px 0 4px}
.moods button{font-size:1.9rem;width:52px;height:52px;border-radius:50%;border:2px solid transparent;opacity:.65}
.moods button.on{border-color:var(--gold);opacity:1}
.preview{width:100%;max-width:500px;margin:0 auto;padding:48px 24px;border-radius:var(--r);font:1.3rem/1.9 var(--fq);text-align:center;color:#fff;min-height:200px;display:flex;align-items:center;justify-content:center;word-break:break-word;background:var(--grad) center/cover}
.answer-question{max-width:500px;margin:0 auto 24px;padding:24px;background:var(--card);border:1px solid var(--border-strong);border-radius:var(--r);font:1.2rem/1.8 var(--fq);text-align:center;color:var(--gold-light)}
.modal{position:fixed;inset:0;background:var(--veil);backdrop-filter:blur(20px);z-index:300;overflow-y:auto;padding:calc(84px + env(safe-area-inset-top)) 8px 130px;animation:fi .3s}
.modal-content img,.modal-content video{width:100%;border-radius:var(--r);margin-bottom:16px;background:#000}
.modal-text{padding:32px 24px;border-radius:var(--r);font:1.3rem/1.9 var(--fq);text-align:center;margin-bottom:16px;color:#fff;word-break:break-word;background:var(--grad) center/cover}
.modal-date{text-align:center;color:var(--gold);font:.95rem var(--fd);margin-bottom:24px;padding:8px 16px;border-radius:999px;background:var(--gold-soft)}
.modal-cap{text-align:center;color:var(--text-2);margin-bottom:16px}
.modal-actions{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 40px;z-index:320;max-width:560px;margin:0 auto;pointer-events:none}
.modal-actions button{pointer-events:auto;width:62px;height:62px;border-radius:50%;background:var(--card);border:1px solid var(--border-strong);font-size:1.5rem;box-shadow:var(--shadow)}
#modalHeart.active{background:#EF4444;border-color:#EF4444;color:#fff}
#modalDelete{color:#EF4444;border-color:rgba(239,68,68,.5)}
.moments-grid{display:flex;flex-direction:column;gap:24px}
.moment-card{border-radius:var(--r);overflow:hidden;background:var(--card);cursor:pointer;border:1px solid var(--border);animation:fu .4s both}
.moment-card img,.moment-card video{width:100%;max-height:70vh;object-fit:contain;background:#000}
.text-content{padding:32px 24px;text-align:center;font:1.2rem/1.9 var(--fq);color:#fff;min-height:160px;display:flex;align-items:center;justify-content:center;word-break:break-word;background:var(--grad) center/cover}
.moment-caption{font-size:1rem;color:var(--text-2);padding:10px 16px 0}
.moment-meta{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid var(--border);min-height:40px}
.moment-time{font:.9rem var(--fd);color:var(--text-3)}
.moment-fav{color:var(--gold);font-size:1.15rem}
.filters{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter-chip{padding:9px 18px;border-radius:999px;border:1px solid var(--border-strong);color:var(--text-3);font-size:.92rem;white-space:nowrap;flex-shrink:0;font-weight:500}
.filter-chip.active{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.stats-title{font:500 1.6rem var(--fd);text-align:center;margin-bottom:28px;color:var(--gold)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:560px;margin:0 auto}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:24px 16px;text-align:center}
.stat-num{font:600 2.1rem/1 var(--fd);color:var(--gold);display:block;margin-bottom:6px}
.stat-label{color:var(--text-3);font-size:.9rem}
.empty-state{text-align:center;color:var(--text-3);margin-top:70px;line-height:2;padding:24px}
.empty-icon{font-size:3rem;display:block;opacity:.4;color:var(--gold)}
.empty-title{font:500 1.2rem var(--fd);color:var(--text-2)}
.settings-group{margin-bottom:24px}
.settings-group-title{font:500 .85rem var(--fd);letter-spacing:.08em;color:var(--gold);padding:0 8px;margin-bottom:8px}
.settings-list{background:var(--card);border-radius:var(--r);border:1px solid var(--border);overflow:hidden}
.settings-item{display:flex;align-items:center;gap:16px;padding:16px;border-bottom:1px solid var(--border);width:100%;text-align:start;min-height:60px}
.settings-item:last-child{border:none}
.settings-item:active{background:var(--card-hover)}
.settings-item .icon{width:26px;display:flex;justify-content:center}
.settings-item .info{flex:1;display:flex;flex-direction:column}
.settings-item .value{font-size:.88rem;color:var(--text-3)}
.settings-item.danger .label{color:#EF4444}.settings-item.danger svg{stroke:#EF4444}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:90%;padding:12px 22px;border-radius:999px;background:var(--card);border:1px solid var(--gold);color:var(--gold);font-weight:500;font-size:.95rem;z-index:30000;box-shadow:var(--shadow);pointer-events:none;text-align:center}
#toast.err{border-color:#EF4444;color:#EF4444}
#remBanner{position:fixed;top:0;left:0;right:0;background:var(--card);border-bottom:2px solid var(--gold);padding:calc(14px + env(safe-area-inset-top)) 16px 14px;z-index:9998;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
#lock{position:fixed;inset:0;background:var(--bg);z-index:20000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.lock-t{font:600 1.5rem var(--fd);color:var(--gold)}
.dots{display:flex;gap:18px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold)}.dots i.on{background:var(--gold)}
.lock-m{min-height:1.6em;color:#EF4444;font-size:.95rem}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:14px}
.pad button{height:78px;border-radius:50%;border:1px solid var(--border-strong);font:600 1.6rem var(--fd)}
.pad button:active{background:var(--gold-soft)}
</style>
</head>
<body>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>
<div id="splash"><div class="splash-logo">Lahza</div><div class="splash-sub" data-i18n="app">لحظة</div></div>
<div id="lock" class="hidden"><button class="xbtn" id="lockX" style="position:absolute;top:calc(16px + env(safe-area-inset-top));left:16px">✕</button><div class="lock-t" id="lockT"></div><div class="dots" id="dots"></div><div class="lock-m" id="lockM"></div><div class="pad" id="pad"></div></div>

<div class="content" id="tabHome">
  <div class="home-greeting" id="greeting"></div>
  <div class="home-date" id="todayDate"></div>
  <div class="home-hijri" id="hijriDate"></div>
  <div class="quote-card" id="questionCard" role="button" tabindex="0"><div class="quote-card-title" data-i18n="qod"></div></div>
  <div class="home-actions">
    <button class="home-action" id="actionPhoto"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg><span class="label" data-i18n="photo"></span><span class="arrow">›</span></button>
    <button class="home-action" id="actionVideo"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg><span class="label" data-i18n="video"></span><span class="arrow">›</span></button>
    <button class="home-action" id="actionText"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg><span class="label" data-i18n="text"></span><span class="arrow">›</span></button>
    <button class="home-action" id="actionOldDate"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span class="label" data-i18n="old"></span><span class="arrow">›</span></button>
  </div>
  <div class="on-this-day hidden" id="onThisDay"><div class="on-this-day-title" data-i18n="otd"></div><div id="onThisDayYears"></div></div>
  <button class="home-stats" id="homeStats">
    <div class="home-stat"><span class="num" id="streakText">0</span><span class="lbl" data-i18n="streak"></span></div>
    <div class="home-stat"><span class="num" id="counterText">0</span><span class="lbl" data-i18n="moments"></span></div>
  </button>
</div>

<div class="content hidden" id="tabMoments">
  <h1 class="page-title" data-i18n="mine"></h1>
  <input class="search" id="searchInput" type="search" data-ph="search">
  <div class="filters" id="filterRow">
    <button class="filter-chip active" data-filter="all" data-i18n="all"></button>
    <button class="filter-chip" data-filter="photo" data-i18n="photos"></button>
    <button class="filter-chip" data-filter="video" data-i18n="videos"></button>
    <button class="filter-chip" data-filter="text" data-i18n="texts"></button>
    <button class="filter-chip" data-filter="answer" data-i18n="answers"></button>
    <button class="filter-chip" data-filter="favorite" data-i18n="favs"></button>
  </div>
  <div id="searchResults" class="moments-grid hidden"></div>
  <div id="treeView">
    <div id="yearsRow" class="filters"></div>
    <div class="hidden" id="monthsSection"><div id="monthsGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 16px"></div></div>
    <div class="hidden" id="calendarSection">
      <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0">
        <button class="btn small" id="calPrev" aria-label="prev" style="width:48px;height:48px;padding:0;margin:0;font-size:1.3rem">›</button>
        <div id="calTitle" style="font:1.15rem var(--fd)"></div>
        <button class="btn small" id="calNext" aria-label="next" style="width:48px;height:48px;padding:0;margin:0;font-size:1.3rem">‹</button>
      </div>
      <div id="calHead" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px;text-align:center;color:var(--text-3);font-size:.8rem"></div>
      <div id="calendarGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px"></div>
    </div>
  </div>
  <div class="empty-state hidden" id="empty"><span class="empty-icon">✦</span><div class="empty-title" data-i18n="empty_t"></div><div data-i18n="empty_s"></div></div>
</div>

<div class="content hidden" id="tabSettings">
  <h1 class="page-title" data-i18n="settings"></h1>
  <div class="settings-group"><div class="settings-group-title" data-i18n="general"></div><div class="settings-list">

const M='moments',B='blobs';let db;
const rq=r=>new Promise((s,j)=>{r.onsuccess=()=>s(r.result);r.onerror=()=>j(r.error)});
const txDone=tx=>new Promise((s,j)=>{tx.oncomplete=s;tx.onerror=tx.onabort=()=>j(tx.error)});
function openDB(){return new Promise((s,j)=>{const r=indexedDB.open('lahza-db',2);
  r.onupgradeneeded=()=>{const d=r.result,tx=r.transaction;
    if(!d.objectStoreNames.contains(M))d.createObjectStore(M,{keyPath:'id',autoIncrement:true});
    if(!d.objectStoreNames.contains(B))d.createObjectStore(B);
    tx.objectStore(M).openCursor().onsuccess=ev=>{const c=ev.target.result;if(!c)return;const v=c.value;
      if(v.blob){tx.objectStore(B).put(v.blob,v.id);delete v.blob;c.update(v)}c.continue()}};
  r.onsuccess=()=>{db=r.result;s()};r.onerror=()=>j(r.error)})}
const getAll=()=>rq(db.transaction(M).objectStore(M).getAll());
const getMeta=id=>rq(db.transaction(M).objectStore(M).get(id));
const getBlob=k=>rq(db.transaction(B).objectStore(B).get(k));
const putBlob=(k,b)=>rq(db.transaction(B,'readwrite').objectStore(B).put(b,k));
const upd=m=>rq(db.transaction(M,'readwrite').objectStore(M).put(m));
async function addMoment(m,blob,bg){
  const tx=db.transaction([M,B],'readwrite');if(bg)m.bgKey=true;
  const id=await rq(tx.objectStore(M).add(m));tx.objectStore(B).put(blob,id);if(bg)tx.objectStore(B).put(bg,'bg'+id);
  await txDone(tx);return id}
async function delMoment(id){const tx=db.transaction([M,B],'readwrite');tx.objectStore(M).delete(id);tx.objectStore(B).delete(id);tx.objectStore(B).delete('bg'+id);await txDone(tx)}

async function hash(p){let s=LS('lahza-salt');if(!s){s=Array.from(crypto.getRandomValues(new Uint8Array(8))).join('');LS('lahza-salt',s)}
  if(crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h=5381;(s+p).split('').forEach(c=>h=((h<<5)+h+c.charCodeAt(0))|0);return String(h)}
const pad=$('pad');['1','2','3','4','5','6','7','8','9','bio','0','<'].forEach(k=>{const b=document.createElement('button');
  b.textContent=k==='<'?'⌫':k==='bio'?'🔓':k;if(k==='bio'){b.id='bioBtn';b.onclick=tryBio}else b.onclick=()=>pinKey(k);pad.appendChild(b)});

async function pinKey(k){if(k==='<'){PIN.buf=PIN.buf.slice(0,-1);lockUI();return}if(PIN.buf.length>=4)return;PIN.buf+=k;$('lockM').textContent='';lockUI();if(PIN.buf.length<4)return;
  const b=PIN.buf;
  if(PIN.mode==='unlock'||PIN.mode==='remove'){if(await hash(b)===LS('lahza-pin')){if(PIN.mode==='remove')LS('lahza-pin','');hide('lock');updateLockStatus()}else{PIN.buf='';$('lockM').textContent=t('lock_wrong');setTimeout(lockUI,150)}}
  else if(PIN.mode==='set1'){PIN.first=b;PIN.buf='';PIN.mode='set2';lockUI()}
  else if(b===PIN.first){LS('lahza-pin',await hash(b));hide('lock');updateLockStatus();toast(t('lock_set'))}
  else{PIN.mode='set1';PIN.buf='';$('lockM').textContent=t('lock_mismatch');lockUI()}}

    else{d.style.textAlign='start';const q=document.createElement('div');q.style.cssText='color:var(--gold);margin-bottom:16px;font-family:var(--fd);font-size:1.1rem';q.textContent=m.caption||'';const a=document.createElement('div');a.style.cssText='font-size:1.1rem';a.textContent=txt;d.append(q,a)}
    c.appendChild(d)}
  if(m.caption&&m.type!=='answer'){const cp=document.createElement('div');cp.className='modal-cap';cp.textContent=m.caption;c.appendChild(cp)}
  const dd=document.createElement('div');dd.className='modal-date';dd.textContent=(m.mood?m.mood+'  ':'')+fdate(m.date)+(m.noTime?'':' - '+ftime(m.date));c.appendChild(dd);
  const hb=$('modalHeart'),paint=f=>{hb.textContent=f?'♥':'♡';hb.className=f?'active':''};paint(m.favorite);
  hb.onclick=async()=>{const mm=await getMeta(id);if(!mm)return;mm.favorite=!mm.favorite;await upd(mm);paint(mm.favorite)};
  show('momentModal')}
$('modalClose').onclick=()=>{hide('momentModal');free(LM);$('modalContent').innerHTML='';S.cur=null;refreshAll()};
$('modalDelete').onclick=async()=>{if(!S.cur)return;if(!await ask(t('del_c'),''))return;await delMoment(S.cur);hide('momentModal');free(LM);S.cur=null;toast(t('deleted'));refreshAll()};
$('modalEdit').onclick=async()=>{if(!S.cur)return;const m=await getMeta(S.cur),b=await getBlob(S.cur),body=(m.type==='text'||m.type==='answer');
  $('eBodyWrap').classList.toggle('hidden',!body);$('eCapWrap').classList.toggle('hidden',m.type==='answer');
  $('eBody').value=body&&b?await b.text():'';$('eCap').value=m.caption||'';show('eSheet')};
$('eNo').onclick=()=>hide('eSheet');
$('eOk').onclick=async()=>{const id=S.cur,m=await getMeta(id);if(!m)return;
  if(m.type!=='answer')m.caption=$('eCap').value.trim();
  if(m.type==='text'||m.type==='answer'){const x=$('eBody').value.trim();if(!x)return toast(t('write_first'),1);m.txt=x;await putBlob(id,new Blob([x],{type:'text/plain'}))}
  await upd(m);hide('eSheet');toast(t('saved'));openModal(id);refreshAll()};

/* ============ نافذة التأكيد ============ */
let _res=null;
function ask(title,msg,o){o=o||{};return new Promise(r=>{_res=r;$('cTitle').textContent=title;$('cMsg').textContent=msg;$('cMsg').classList.toggle('hidden',!msg);
  $('cOk').textContent=o.ok||t('ok');$('cNo').textContent=o.no||t('cancel');S.word=o.word||null;$('cInWrap').classList.toggle('hidden',!o.word);$('cIn').value='';show('cSheet')})}
$('cNo').onclick=()=>{hide('cSheet');_res&&_res(false)};
$('cOk').onclick=()=>{if(S.word&&$('cIn').value.trim()!==S.word)return toast(t('type_word'),1);hide('cSheet');_res&&_res(true)};

/* ============ التذكير (إشعارات أصلية داخل Capacitor، وبانر في المتصفح) ============ */
function loadReminder(){const on=LS('lahza-reminder')==='true';$('reminderStatus').textContent=on?t('on'):t('off');$('reminderTime').value=LS('lahza-reminder-time')||'20:00';$('reminderToggleBtn').textContent=on?t('rem_off'):t('rem_on')}
async function syncNative(){const p=PLG('LocalNotifications');if(!p)return;
  try{await p.cancel({notifications:[{id:1}]});if(LS('lahza-reminder')!=='true')return;
    const pm=await p.requestPermissions();if(pm.display!=='granted')return;
    const tm=(LS('lahza-reminder-time')||'20:00').split(':').map(Number);
    await p.schedule({notifications:[{id:1,title:t('rem_title'),body:t('rem_sub'),schedule:{on:{hour:tm[0],minute:tm[1]},allowWhileIdle:true}}]})}catch(e){}}
$('btnReminder').onclick=()=>{loadReminder();show('reminderModal')};
$('reminderClose2').onclick=()=>hide('reminderModal');
$('reminderToggleBtn').onclick=()=>{const on=LS('lahza-reminder')==='true';LS('lahza-reminder',on?'false':'true');LS('lahza-reminder-dismissed','');
  if(!on&&!PLG('LocalNotifications')&&window.Notification&&Notification.permission==='default')Notification.requestPermission();loadReminder();syncNative()};
$('reminderTime').onchange=e=>{LS('lahza-reminder-time',e.target.value);LS('lahza-reminder-dismissed','');syncNative()};
async function checkReminder(){try{
  if(PLG('LocalNotifications')||LS('lahza-reminder')!=='true')return;const now=new Date(),today=dstr(now);if(LS('lahza-reminder-dismissed')===today)return;
  const tm=(LS('lahza-reminder-time')||'20:00').split(':').map(Number);if(now.getHours()*60+now.getMinutes()<tm[0]*60+tm[1])return;
  const ms=await getAll();if(ms.some(m=>dstr(m.date)===today&&!m.noTime))return;
  LS('lahza-reminder-dismissed',today);
  if(window.Notification&&Notification.permission==='granted'&&document.hidden){new Notification(t('rem_title'),{body:t('rem_sub')});return}
  const old=$('remBanner');if(old)old.remove();
  const b=document.createElement('div');b.id='remBanner';const w=document.createElement('div');w.style.flex='1';
  const a=document.createElement('div');a.style.cssText='font:500 1.1rem var(--fd);color:var(--gold)';a.textContent=t('rem_title');
  const s=document.createElement('div');s.style.cssText='color:var(--text-3);font-size:.9rem';s.textContent=t('rem_sub');w.append(a,s);
  const btn=document.createElement('button');btn.className='btn primary small';btn.style.cssText='width:auto;margin:0;padding:10px 20px';btn.textContent=t('now');
  btn.onclick=()=>{b.remove();switchTab('Home')};b.append(w,btn);document.body.appendChild(b);setTimeout(()=>b.remove(),12000)}catch(e){}}

/* ============ المظهر والخط واللغة ============ */
$('btnTheme').onclick=()=>show('themeModal');$('themeClose').onclick=()=>hide('themeModal');
document.querySelectorAll('#themeModal [data-mode]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.mode;applyTheme();toast(t('theme_ok'))});
$('btnFont').onclick=()=>show('fontModal');$('fontClose').onclick=()=>hide('fontModal');
document.querySelectorAll('#fontModal [data-fs]').forEach(b=>b.onclick=()=>{S.fs=b.dataset.fs;applyFs()});
$('btnLanguage').onclick=()=>show('languageModal');$('languageClose').onclick=()=>hide('languageModal');
document.querySelectorAll('#languageModal [data-lang]').forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;LS('lahza-lang',S.lang);applyTheme();applyI18n();hide('languageModal');renderOnThisDay();syncNative()});

/* ============ التصدير والاستيراد ============ */
async function buildZip(ms){const zip=new JSZip(),meta=[];
  for(const m of ms){const ext=m.type==='photo'?'jpg':m.type==='video'?'mp4':'txt',fn=m.id+'.'+ext,b=await getBlob(m.id);if(b)zip.file('moments/'+fn,b);
    const e={id:m.id,date:m.date,type:m.type,caption:m.caption||'',favorite:!!m.favorite,noTime:!!m.noTime,mood:m.mood||null,background:m.background||null,file:fn};
    if(m.bgKey){const bb=await getBlob('bg'+m.id);if(bb){zip.file('bg/'+m.id,bb);e.bgFile='bg/'+m.id}}meta.push(e)}
  zip.file('data.json',JSON.stringify({version:'4.0',date:new Date().toISOString(),count:ms.length,moments:meta},null,2));
  return zip.generateAsync({type:'blob'})}
async function exportZip(ms){toast(t('prep'));const blob=await buildZip(ms),name='lahza-backup-'+dstr(new Date())+'.zip',f=new File([blob],name,{type:'application/zip'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name})}
  else{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
  LS('lahza-last-backup',String(Date.now()));toast(t('exp_ok')+' ('+ms.length+')')}
$('btnExport').onclick=async()=>{try{const ms=await getAll();if(!ms.length)return toast(t('no_data'),1);await exportZip(ms)}catch(e){if(e.name!=='AbortError')toast(t('err')+': '+e.message,1)}};
$('btnImport').onclick=()=>$('importInput').click();
$('importInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const zip=await JSZip.loadAsync(f),df=zip.file('data.json');if(!df)throw new Error('Invalid file');const data=JSON.parse(await df.async('string'));if(!Array.isArray(data.moments))throw new Error('Invalid structure');
    const key=m=>m.date+'|'+m.type+'|'+(m.caption||''),have=new Set((await getAll()).map(key));let added=0;
    for(const x of data.moments){if(have.has(key(x)))continue;const file=zip.file('moments/'+x.file);if(!file)continue;const blob=await file.async('blob');
      const m={date:x.date,type:x.type,caption:x.caption||'',favorite:!!x.favorite};if(x.noTime)m.noTime=true;if(x.mood)m.mood=x.mood;
      if(x.type==='text'||x.type==='answer')m.txt=await blob.text();
      let bg=null;if(x.bgFile&&zip.file(x.bgFile))bg=await zip.file(x.bgFile).async('blob');else if(x.background)m.background=x.background;
      await addMoment(m,blob,bg);added++}
    toast(t('imp_ok')+' ('+added+')');refreshAll()}catch(err){toast(t('err')+': '+err.message,1)}e.target.value=''};
$('btnDeleteAll').onclick=async()=>{const ms=await getAll();if(!ms.length)return toast(t('no_data'),1);
  if(!await ask(t('delall'),t('delall_q').replace('{n}',ms.length)))return;
  if(await ask(t('backup'),t('backup_q'),{ok:t('yes_exp'),no:t('skip')})){try{await exportZip(ms)}catch(e){if(!await ask(t('exp_fail'),t('exp_fail_q'),{ok:t('del_anyway')}))return}}
  if(!await ask(t('final'),t('final_q'),{word:t('del_word'),ok:t('del_final')}))return;
  await clearAll();toast(t('deleted'));closeDay();refreshAll()};
$('btnContact').onclick=()=>{location.href='mailto:lahzalaqta@gmail.com?subject='+encodeURIComponent(t('mail_sub'))};
async function nudge(){if(!$('lock').classList.contains('hidden'))return;const ms=await getAll();if(ms.length<3)return;const now=Date.now(),last=+LS('lahza-last-backup')||0;
  if(!last){LS('lahza-last-backup',String(now));return}
  if(now-last<6048e5||LS('lahza-nudged')===dstr(now))return;LS('lahza-nudged',dstr(now));
  if(await ask(t('backup'),t('nudge_q'),{ok:t('yes_exp'),no:t('later')}))try{await exportZip(ms)}catch(e){}}

/* ============ التقييم (نافذة آبل الرسمية) ============ */
$('btnRate').onclick=async()=>{const p=PLG('InAppReview');
  try{if(p)await p.requestReview();else window.open('https://apps.apple.com/app/idYOUR_APP_ID?action=write-review','_blank')}catch(e){}};

/* ============ الإحصائيات ============ */
$('homeStats').onclick=async()=>{const ms=await getAll(),days=[...new Set(ms.map(m=>dstr(m.date)))].sort();let best=days.length?1:0,cur=1;
  for(let i=1;i<days.length;i++){const d=Math.round((new Date(days[i]+'T12:00:00')-new Date(days[i-1]+'T12:00:00'))/864e5);if(d===1){cur++;best=Math.max(best,cur)}else cur=1}
  const now=new Date(),m0=new Date(now.getFullYear(),now.getMonth(),1);
  $('statTotal').textContent=ms.length;$('statDays').textContent=days.length;$('statBest').textContent=best;$('statMonth').textContent=ms.filter(m=>new Date(m.date)>=m0).length;show('statsModal')};
$('statsClose').onclick=()=>hide('statsModal');

/* ============ الأسئلة ============ */
const bank=()=>QUESTIONS_BANK[S.lang]||QUESTIONS_BANK.ar;
$('questionCard').onclick=()=>{const l=$('sectionList');l.innerHTML='';Object.keys(bank()).forEach(sec=>{const b=document.createElement('button');b.className='section-item';b.textContent=sec;b.onclick=()=>{hide('questionSheet');openQList(sec)};l.appendChild(b)});show('questionSheet')};
$('questionCard').onkeydown=e=>{if(e.key==='Enter')e.target.click()};
$('sheetClose').onclick=()=>hide('questionSheet');
function openQList(sec){$('questionListTitle').textContent=sec;const l=$('questionList');l.innerHTML='';
  (bank()[sec]||[]).forEach(q=>{const b=document.createElement('button');b.className='question-item';b.textContent=q;b.onclick=()=>{hide('questionListSheet');S.sec=sec;S.q=q;$('answerQuestion').textContent=q;$('answerInput').value='';show('answerScreen')};l.appendChild(b)});show('questionListSheet')}
$('questionListClose').onclick=()=>hide('questionListSheet');
$('answerClose').onclick=()=>hide('answerScreen');
$('answerSaveBtn').onclick=async()=>{const x=$('answerInput').value.trim();if(!x)return toast(t('write_first'),1);
  try{await addMoment({date:new Date().toISOString(),type:'answer',caption:S.q,favorite:false,section:S.sec,txt:x},new Blob([x],{type:'text/plain'}));hide('answerScreen');toast(t('saved_a'));refreshAll()}catch(e){toast(t('err'),1)}};

/* ============ التشغيل ============ */
setTimeout(()=>{const sp=$('splash');sp.classList.add('hide');setTimeout(()=>sp.style.display='none',800)},1600);
(async function init(){
  try{S.theme=LS('lahza-theme')||'auto';if(!['dark','light','auto'].includes(S.theme))S.theme='auto';
    S.fs=LS('lahza-fs')||'m';if(!FSZ[S.fs])S.fs='m';
    const l=LS('lahza-lang');S.lang=I[l]?l:'ar';applyFs();applyTheme();applyI18n();
    if(LS('lahza-pin'))showLock('unlock');
    await openDB();
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
    refreshAll();backfill();syncNative();checkReminder();setInterval(checkReminder,60000);setTimeout(nudge,5000);
  }catch(e){console.error(e);toast(t('err')+': '+e.message,1)}
})();
</script>
