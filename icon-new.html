<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>New Icon</title>
<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
  .icon{
    width:min(90vw,500px);
    height:min(90vw,500px);
    background:linear-gradient(135deg,#0F0A08 0%,#1A0505 50%,#0F0A08 100%);
    border:6px solid #D4AF37;
    border-radius:22.5%;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 0 40px rgba(212,175,55,0.4), inset 0 0 40px rgba(212,175,55,0.1);
  }
  .icon-text{
    font-family:'Allura',cursive;
    font-size:min(25vw,140px);
    color:#D4AF37;
    line-height:1;
    text-shadow:0 0 20px rgba(212,175,55,0.6);
  }
</style>
</head>
<body>
  <div class="icon">
    <div class="icon-text">Lahza</div>
  </div>
</body>
</html>
