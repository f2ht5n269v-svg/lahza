<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لحظة</title>
<style>
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: -apple-system, sans-serif;
    text-align: center;
    padding: 24px;
    margin: 0;
    min-height: 100vh;
    box-sizing: border-box;
  }
  h1 { font-size: 2.2rem; font-weight: 300; letter-spacing: 2px; margin: 8px 0; }
  p { color: #888; font-size: 0.95rem; line-height: 1.7; margin-bottom: 20px; }
  button {
    margin: 10px 6px;
    padding: 16px 40px;
    border: 1px solid #333;
    border-radius: 100px;
    background: transparent;
    color: #fff;
    font-size: 1.1rem;
  }
  button.rec { border-color: #ef4444; color: #ef4444; }
  button.recording { background: #ef4444; color: #fff; }
  video {
    width: 100%;
    max-width: 300px;
    border-radius: 16px;
    margin: 16px auto;
    display: block;
    background: #000;
  }
  #status { margin-top: 14px; color: #4ade80; font-size: 0.9rem; min-height: 20px; }
  #timer { font-size: 3rem; color: #ef4444; display: none; margin: 10px 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <h1>لحظة</h1>
  <p>صوّر ثانية واحدة كل يوم.<br>خلي ذكرياتك تتراكم لحالها.</p>
  <video id="video" autoplay playsinline muted></video>
  <div id="timer">1</div>
  <button id="startBtn">ابدأ</button>
  <button id="recBtn" class="hidden">● سجّل ثانية</button>
  <button id="saveBtn" class="hidden">💾 احفظ</button>
  <div id="status"></div>
<script>
const video = document.getElementById('video');
const startBtn = document.getElementById('startBtn');
const recBtn = document.getElementById('recBtn');
const saveBtn = document.getElementById('saveBtn');
const status = document.getElementById('status');
const timer = document.getElementById('timer');
let stream = null, recorder = null, chunks = [], recordedBlob = null;
startBtn.addEventListener('click', async () => {
  try {
    status.textContent = 'جاري فتح الكاميرا...';
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    video.srcObject = stream; video.muted = true;
    startBtn.classList.add('hidden'); recBtn.classList.remove('hidden');
    status.textContent = '✅ الكاميرا شغالة';
  } catch (err) { status.textContent = '❌ خطأ: ' + err.message; }
});
recBtn.addEventListener('click', () => {
  if (!stream) return;
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
  recorder.onstop = () => {
    recordedBlob = new Blob(chunks, { type: 'video/webm' });
    const url = URL.createObjectURL(recordedBlob);
    video.srcObject = null; video.src = url; video.muted = false; video.loop = true; video.play();
    recBtn.classList.add('hidden'); saveBtn.classList.remove('hidden');
    status.textContent = '✅ تم التسجيل!';
  };
  recorder.start();
  recBtn.classList.add('recording'); recBtn.textContent = '● جاري التسجيل';
  timer.style.display = 'block'; timer.textContent = '1';
  setTimeout(() => {
    timer.style.display = 'none';
    if (recorder.state === 'recording') recorder.stop();
    recBtn.classList.remove('recording'); recBtn.textContent = '● سجّل ثانية';
  }, 1000);
});
saveBtn.addEventListener('click', () => {
  if (!recordedBlob) return;
  const url = URL.createObjectURL(recordedBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'lahza-' + new Date().toISOString().slice(0,10) + '.webm';
  a.click();
  status.textContent = '💾 تم الحفظ!';
});
</script>
</body>
</html>
