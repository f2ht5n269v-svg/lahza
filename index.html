<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0F0A08">
<title>لحظة</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Amiri:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0F0A08;--card:#1A1410;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.18);--gold:#D4AF37;--gold-soft:rgba(212,175,55,.12);--on-gold:#0F0A08;--text:#F5F5F5;--text-2:#D0D0D0;--text-3:#A8A8A8;--text-4:#8A8A8A;--nav:rgba(15,10,8,.96);--grad:linear-gradient(135deg,#1F1508,#0F0A08);--shadow:0 4px 20px rgba(0,0,0,.5);--fd:'Reem Kufi',sans-serif;--fb:'IBM Plex Sans Arabic',sans-serif;--fq:'Amiri',serif}
:root[data-theme=light]{color-scheme:light;--bg:#FAF6EE;--card:#FFF;--border:rgba(0,0,0,.1);--border-strong:rgba(0,0,0,.2);--gold:#8B7524;--gold-soft:rgba(139,117,36,.12);--on-gold:#fff;--text:#1A1410;--text-2:#3A3025;--text-3:#5A5045;--text-4:#756B60;--nav:rgba(250,246,238,.96);--grad:linear-gradient(135deg,#3a2a12,#1a1410);--shadow:0 4px 20px rgba(0,0,0,.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px;height:100%}html,body{overflow:hidden;background:var(--bg)}body{height:100%;color:var(--text);font:1rem/1.65 var(--fb);display:flex;flex-direction:column}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}input,textarea{font-family:var(--fb);font-size:1rem;outline:none;border:none;background:none;color:inherit}textarea{resize:none}img{display:block;max-width:100%}
.hidden{display:none!important}
@keyframes fi{from{opacity:0}to{opacity:1}}
.content{flex:1;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top)) 16px 120px;animation:fi .3s}
.page-title{font:600 1.7rem var(--fd);text-align:center;margin-bottom:20px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:100}
.tab{flex:1;padding:12px 0;font-size:.8rem;font-weight:500;color:var(--text-4);display:flex;flex-direction:column;align-items:center;gap:4px}
.tab svg{width:24px;height:24px;stroke-width:1.8;stroke:currentColor;fill:none}
.tab.active{color:var(--gold)}
#splash{position:fixed;inset:0;background:var(--grad);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .8s}
#splash.hide{opacity:0;pointer-events:none}
.splash-logo{font:400 5rem/1 'Great Vibes',cursive;color:var(--gold)}
.home-greeting{font:400 1.25rem var(--fd);color:var(--text-2)}.home-date{font-size:.95rem;color:var(--text-3);margin-bottom:6px}.home-hijri{font:.95rem var(--fd);color:var(--gold);margin-bottom:18px}
.home-action{display:flex;align-items:center;gap:16px;padding:16px 8px;border-bottom:1px solid var(--border);font-size:1.1rem;width:100%;text-align:start}
.home-action svg{width:24px;height:24px;stroke:var(--gold);fill:none}
.home-action .label{flex:1}
.home-stats{margin-top:28px;display:flex;gap:32px;justify-content:center;padding:16px 0;border-block:1px solid var(--border);width:100%}
.home-stat{display:flex;flex-direction:column;align-items:center;gap:4px}.home-stat .num{color:var(--text);font:600 1.6rem/1 var(--fd)}.home-stat .lbl{font-size:.85rem;color:var(--text-3)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .3s}
.sheet-content{width:100%;max-width:480px;background:var(--card);border-radius:28px;border:1px solid var(--border-strong);padding:24px 16px;max-height:85vh;overflow-y:auto;text-align:center;position:relative}
.xbtn{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--border-strong);color:var(--text);font-size:1.15rem;display:flex;align-items:center;justify-content:center}
.btn-close{position:fixed;top:16px;left:16px;z-index:410}
.btn{display:block;width:100%;max-width:360px;margin:10px auto;padding:16px;border:1.5px solid var(--border-strong);border-radius:999px;text-align:center;background:var(--card)}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:600}
.screen{position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;padding:calc(84px + env(safe-area-inset-top)) 16px 120px;animation:fi .3s}
.screen-title{font:500 1.6rem var(--fd);text-align:center;margin-bottom:24px}
.text-input{width:100%;max-width:500px;margin:0 auto 16px;background:var(--card);border:1px solid var(--border-strong);border-radius:14px;padding:20px;font:1.15rem/1.9 var(--fq);display:block;color:var(--text);min-height:220px}
.moods{display:flex;justify-content:center;gap:10px;margin:8px 0 4px}.moods button{font-size:1.9rem;width:52px;height:52px;border-radius:50%;border:2px solid transparent;opacity:.65}.moods button.on{border-color:var(--gold);opacity:1}
.modal{position:fixed;inset:0;background:var(--bg);z-index:300;overflow-y:auto;padding:calc(84px + env(safe-area-inset-top)) 8px 130px}
.moments-grid{display:flex;flex-direction:column;gap:24px}
.moment-card{border-radius:14px;overflow:hidden;background:var(--card);cursor:pointer;border:1px solid var(--border)}
.moment-card img{width:100%;max-height:70vh;object-fit:contain;background:#000}
.text-content{padding:32px 24px;text-align:center;font:1.2rem/1.9 var(--fq);color:#fff;background:var(--grad)}
.moment-caption{font-size:1rem;color:var(--text-2);padding:10px 16px 0}.moment-meta{display:flex;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--border)}
.filters{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:8px}
.filter-chip{padding:9px 18px;border-radius:999px;border:1px solid var(--border-strong);color:var(--text-3);font-size:.92rem;white-space:nowrap}
.filter-chip.active{background:var(--gold);color:var(--on-gold);font-weight:600}
.settings-list{background:var(--card);border-radius:14px;border:1px solid var(--border);overflow:hidden}
.settings-item{display:flex;align-items:center;gap:16px;padding:16px;border-bottom:1px solid var(--border);width:100%;text-align:start}
.settings-item:last-child{border:none}
.settings-item .icon svg{width:24px;height:24px;stroke:var(--gold);fill:none}
.settings-item .label{flex:1}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:999px;background:var(--card);border:1px solid var(--gold);color:var(--gold);z-index:30000;pointer-events:none;text-align:center;transition:opacity .3s;font-weight:500}
</style>
</head>
<body>
<div id="toast" class="hidden"></div>
<div id="splash"><div class="splash-logo">Lahza</div><div style="color:var(--gold);font:1.2rem var(--fq);margin-top:16px">لحظة</div></div>

<div class="content" id="tabHome">
  <div class="home-greeting" id="greeting"></div>
  <div class="home-date" id="todayDate"></div>
  <div style="height:20px"></div>
  <div class="home-actions">
    <button class="home-action" id="actionText"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg><span class="label">كتابة</span><span class="arrow">›</span></button>
    <button class="home-action" id="actionPhoto"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg><span class="label">صورة</span><span class="arrow">›</span></button>
    <button class="home-action" id="actionVideo"><svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg><span class="label">فيديو</span><span class="arrow">›</span></button>
    <button class="home-action" id="actionAudio"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg><span class="label">صوت</span><span class="arrow">›</span></button>
  </div>
  <button class="home-stats" id="homeStats">
    <div class="home-stat"><span class="num" id="streakText">0</span><span class="lbl">يوم متواصل</span></div>
    <div class="home-stat"><span class="num" id="counterText">0</span><span class="lbl">لقطة</span></div>
  </button>
</div>

<div class="content hidden" id="tabMoments">
  <h1 class="page-title">لقطاتي</h1>
  <div id="momentsGrid" class="moments-grid"></div>
</div>

<div class="content hidden" id="tabSettings">
  <h1 class="page-title">الإعدادات</h1>
  <div class="settings-list">
    <button class="settings-item" id="btnTheme"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg></span><span class="label">المظهر (غامق/فاتح)</span></button>
  </div>
</div>

<div class="tabs">
  <button class="tab active" id="tabBtnHome"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>الرئيسية</span></button>
  <button class="tab" id="tabBtnMoments"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>لقطاتي</span></button>
  <button class="tab" id="tabBtnSettings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>الإعدادات</span></button>
</div>

<div class="screen hidden" id="photoScreen"><button class="xbtn btn-close" id="photoClose">✕</button><h2 class="screen-title">صورة</h2><video id="photoVideo" autoplay playsinline style="width:100%;border-radius:14px;background:#000"></video><button class="btn primary" id="snapBtn" style="margin-top:16px">التقاط</button><button class="btn primary hidden" id="photoNext" style="margin-top:16px">التالي</button></div>
<div class="screen hidden" id="textScreen"><button class="xbtn btn-close" id="textClose">✕</button><h2 class="screen-title">كتابة</h2><textarea class="text-input" id="textInput"></textarea><button class="btn primary" id="saveTextBtn">حفظ</button></div>
<div class="screen hidden" id="saveScreen"><button class="xbtn btn-close" id="saveClose">✕</button><h2 class="screen-title">حفظ اللقطة</h2><div id="previewWrap"></div><div class="moods" id="moodRow"></div><button class="btn primary" id="saveBtn" style="margin-top:20px">حفظ</button></div>
<div class="modal hidden" id="momentModal"><button class="xbtn btn-close" id="modalClose">✕</button><div class="modal-content" id="modalContent" style="padding:20px"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h) e.innerHTML = h; return e; };
const toastEl = $('#toast');
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.remove('hidden');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(() => toastEl.classList.add('hidden'), 3000);
}

let db, S = { blob: null, type: null, mood: null };

// قاعدة البيانات
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('lahza-db', 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('moments')) d.createObjectStore('moments', { keyPath: 'id', autoIncrement: true });
      if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs');
    };
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
}
const getAll = () => new Promise(res => { const q = db.transaction('moments').objectStore('moments').getAll(); q.onsuccess = () => res(q.result); });
const getBlob = (id) => new Promise(res => { const q = db.transaction('blobs').objectStore('blobs').get(id); q.onsuccess = () => res(q.result); });
async function addMoment(m, blob) {
  return new Promise((res, rej) => {
    const tx = db.transaction(['moments', 'blobs'], 'readwrite');
    const req = tx.objectStore('moments').add(m);
    req.onsuccess = () => { tx.objectStore('blobs').put(blob, req.result); tx.oncomplete = () => res(); };
    tx.onerror = () => rej(tx.error);
  });
}
async function delMoment(id) {
  return new Promise(res => {
    const tx = db.transaction(['moments', 'blobs'], 'readwrite');
    tx.objectStore('moments').delete(id);
    tx.objectStore('blobs').delete(id);
    tx.oncomplete = () => res();
  });
}

// التبويبات
function switchTab(n) {
  ['Home', 'Moments', 'Settings'].forEach(x => {
    $('#tabBtn' + x).classList.toggle('active', x === n);
    $('#tab' + x).classList.toggle('hidden', x !== n);
  });
  if (n === 'Home') updateHome();
  if (n === 'Moments') renderMoments();
}
$('#tabBtnHome').onclick = () => switchTab('Home');
$('#tabBtnMoments').onclick = () => switchTab('Moments');
$('#tabBtnSettings').onclick = () => switchTab('Settings');

async function updateHome() {
  const d = new Date();
  $('#todayDate').textContent = d.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  $('#greeting').textContent = (d.getHours() >= 5 && d.getHours() < 12) ? 'صباح الخير' : 'مساء الخير';
  try {
    const ms = await getAll();
    $('#counterText').textContent = ms.length;
    const days = new Set(ms.map(m => new Date(m.date).toDateString()));
    $('#streakText').textContent = days.size;
  } catch(e){}
}

// الكاميرا
let stream = null;
$('#actionPhoto').onclick = async () => {
  $('#photoScreen').classList.remove('hidden');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    $('#photoVideo').srcObject = stream;
  } catch (e) { toast('تعذر فتح الكاميرا'); }
};
$('#photoClose').onclick = () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
  $('#photoScreen').classList.add('hidden');
  S.blob = null; $('#photoNext').classList.add('hidden');
};
$('#snapBtn').onclick = () => {
  const v = $('#photoVideo');
  if (!v.videoWidth) return;
  const cv = document.createElement('canvas');
  cv.width = v.videoWidth; cv.height = v.videoHeight;
  cv.getContext('2d').drawImage(v, 0, 0);
  cv.toBlob(b => {
    S.blob = b; S.type = 'photo';
    $('#photoNext').classList.remove('hidden');
    toast('تم التقاط الصورة');
  }, 'image/jpeg', 0.85);
};
$('#photoNext').onclick = () => {
  if (!S.blob) return;
  if (stream) stream.getTracks().forEach(t => t.stop());
  $('#photoScreen').classList.add('hidden');
  showPreview(); $('#saveScreen').classList.remove('hidden');
};

// الفيديو والصوت
$('#actionVideo').onclick = () => {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'video/*';
  i.onchange = () => { if (i.files[0]) { S.blob = i.files[0]; S.type = 'video'; showPreview(); $('#saveScreen').classList.remove('hidden'); } };
  i.click();
};
$('#actionAudio').onclick = () => {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'audio/*';
  i.onchange = () => { if (i.files[0]) { S.blob = i.files[0]; S.type = 'audio'; showPreview(); $('#saveScreen').classList.remove('hidden'); } };
  i.click();
};

// الكتابة
$('#actionText').onclick = () => { $('#textInput').value = ''; $('#textScreen').classList.remove('hidden'); };
$('#textClose').onclick = () => $('#textScreen').classList.add('hidden');
$('#saveTextBtn').onclick = () => {
  const txt = $('#textInput').value.trim();
  if (!txt) return toast('اكتب شيئاً أولاً');
  S.blob = new Blob([txt], { type: 'text/plain' }); S.type = 'text';
  $('#textScreen').classList.add('hidden');
  showPreview(); $('#saveScreen').classList.remove('hidden');
};

// الحفظ
function showPreview() {
  const w = $('#previewWrap'); w.innerHTML = '';
  if (S.type === 'photo' || S.type === 'video') {
    const el = document.createElement(S.type === 'photo' ? 'img' : 'video');
    el.src = URL.createObjectURL(S.blob);
    if (S.type === 'video') el.controls = true;
    el.style.cssText = 'width:100%;border-radius:14px;margin-bottom:12px';
    w.appendChild(el);
  } else if (S.type === 'audio') {
    const el = document.createElement('audio'); el.src = URL.createObjectURL(S.blob); el.controls = true; w.appendChild(el);
  } else if (S.type === 'text') {
    S.blob.text().then(t => { const d = mk('div', 'text-content', t); w.appendChild(d); });
  }
  paintMoods();
}
function paintMoods() {
  const r = $('#moodRow'); r.innerHTML = '';
  ['😄','🙂','😐','😔','😢'].forEach(e => {
    const b = mk('button', S.mood === e ? 'on' : '', e);
    b.onclick = () => { S.mood = S.mood === e ? null : e; paintMoods(); };
    r.appendChild(b);
  });
}
$('#saveClose').onclick = () => { $('#saveScreen').classList.add('hidden'); S.blob = null; S.type = null; S.mood = null; };
$('#saveBtn').onclick = async () => {
  if (!S.blob) return;
  try {
    const m = { date: new Date().toISOString(), type: S.type, favorite: false };
    if (S.mood) m.mood = S.mood;
    if (S.type === 'text') m.txt = await S.blob.text();
    await addMoment(m, S.blob);
    toast('تم الحفظ');
    $('#saveClose').click();
    switchTab('Home');
  } catch (e) { toast('خطأ في الحفظ'); }
};

// عرض اللقطات
async function renderMoments() {
  const grid = $('#momentsGrid'); grid.innerHTML = '';
  const ms = (await getAll()).sort((a,b) => new Date(b.date) - new Date(a.date));
  if (!ms.length) { grid.innerHTML = '<div style="text-align:center;color:#888;margin-top:40px;">لا توجد لقطات بعد</div>'; return; }
  
  for (const m of ms) {
    const c = mk('div', 'moment-card');
    const b = await getBlob(m.id);
    if (m.type === 'photo' && b) {
      const im = new Image(); im.src = URL.createObjectURL(b); c.appendChild(im);
    } else if (m.type === 'text' && b) {
      c.appendChild(mk('div', 'text-content', m.txt || await b.text()));
    } else {
      c.appendChild(mk('div', 'text-content', m.type === 'video' ? '🎥 فيديو' : '🎙 صوت'));
    }
    const meta = mk('div', 'moment-meta');
    meta.innerHTML = `<span>${m.mood || ''}</span><span style="font-size:.9rem;color:var(--text-3)">${new Date(m.date).toLocaleDateString('ar-EG')}</span>`;
    c.appendChild(meta);
    c.onclick = () => {
      if (confirm('هل تريد حذف هذه اللقطة؟')) {
        delMoment(m.id).then(() => { toast('تم الحذف'); renderMoments(); updateHome(); });
      }
    };
    grid.appendChild(c);
  }
}

// المظهر
$('#btnTheme').onclick = () => {
  const curr = document.documentElement.dataset.theme || 'dark';
  const next = curr === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('lahza-theme', next);
  toast('تم تغيير المظهر');
};

// التشغيل
async function init() {
  try {
    const savedTheme = localStorage.getItem('lahza-theme');
    if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    await openDB();
    updateHome();
  } catch (e) {
    console.error(e);
  } finally {
    setTimeout(() => { $('#splash').classList.add('hide'); }, 1500);
  }
}
init();
</script>
</body>
</html>
