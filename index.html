let db;const rq=r=>new Promise((s,j)=>{r.onsuccess=()=>s(r.result);r.onerror=()=>j(r.error)});
const openDB=()=>new Promise((s,j)=>{
 const r=indexedDB.open('lahza-db',2);
 r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('moments'))d.createObjectStore('moments',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('blobs'))d.createObjectStore('blobs')};
 r.onsuccess=()=>{db=r.result;s()};r.onerror=()=>j(r.error)
});
const getAll=()=>rq(db.transaction('moments').objectStore('moments').getAll());
const getM=id=>rq(db.transaction('moments').objectStore('moments').get(id));
const getB=k=>rq(db.transaction('blobs').objectStore('blobs').get(k));
const putM=m=>rq(db.transaction('moments','readwrite').objectStore('moments').put(m));
async function add(m,b,extra=[]){
 if(extra.length)m.extra=extra.length;
 const tx=db.transaction(['moments','blobs'],'readwrite');
 const ms=tx.objectStore('moments'),bs=tx.objectStore('blobs');
 const id=await new Promise((resolve,reject)=>{
  const r=ms.add(m);
  r.onsuccess=()=>{try{const id=r.result;bs.put(b,id);extra.forEach((x,i)=>bs.put(x,'p'+id+'_'+i));resolve(id)}catch(e){reject(e);tx.abort()}};
  r.onerror=()=>reject(r.error);
 });
 await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=tx.onabort=()=>rej(tx.error)});
 return id;
}

const needZip=()=>window.JSZip?Promise.resolve():new Promise((s,j)=>{const e=E('script');e.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';e.onload=s;e.onerror=()=>j(new Error('offline'));document.head.appendChild(e)});
const EXT={photo:'jpg',video:'mp4',audio:'m4a',text:'txt',answer:'txt'};
async function exportZ(){
 try{
  await needZip();
  const ms=await getAll(),z=new JSZip(),meta=[];
  for(const m of ms){
   const fn=m.id+'.'+EXT[m.type],b=await getB(m.id);if(b)z.file('moments/'+fn,b);
   for(let i=0;i<(m.extra||0);i++){const p=await getB('p'+m.id+'_'+i);if(p)z.file('extra/'+m.id+'_'+i+'.jpg',p)}
   meta.push({id:m.id,date:m.date,type:m.type,caption:m.caption||'',favorite:!!m.favorite,noTime:!!m.noTime,mood:m.mood||null,mime:m.mime||null,dur:m.dur||0,extra:m.extra||0,section:m.section||null,done:!!m.done,file:fn})
  }
  z.file('data.json',JSON.stringify({version:'16.0',date:new Date().toISOString(),count:ms.length,moments:meta}));
  const blob=await z.generateAsync({type:'blob',compression:'STORE'}),name='lahza-backup-'+new Date().toISOString().slice(0,10)+'.zip',f=new File([blob],name,{type:'application/zip'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:name});
  else{const a=E('a');const url=URL.createObjectURL(f);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  LS('lahza-last-backup',String(Date.now()));toast(t('saved'));
  if(tab==='home')home()
 }catch(e){if(e&&e.name!=='AbortError')toast(t('err')+': '+e.message)}
}
async function importZ(file){
 try{
  await needZip();
  const z=await JSZip.loadAsync(file),df=z.file('data.json');if(!df)throw new Error('data.json');
  const d=JSON.parse(await df.async('string'));
  const key=m=>m.date+'|'+m.type+'|'+(m.caption||'');
  const have=new Set((await getAll()).map(key));let n=0;
  for(const x of d.moments){
   if(have.has(key(x)))continue;
   const f=z.file('moments/'+x.file);if(!f)continue;
   const m={date:x.date,type:x.type,caption:x.caption||'',favorite:!!x.favorite};
   ['noTime','mood','mime','dur','section','done'].forEach(k=>{if(x[k])m[k]=x[k]});
   const raw=await f.async('blob'),b=new Blob([raw],{type:x.mime||(x.type==='photo'?'image/jpeg':x.type==='video'?'video/mp4':'text/plain')});
   if(x.type==='text'||x.type==='answer')m.txt=await b.text();
   const ex=[];
   for(let i=0;i<(x.extra||0);i++){const p=z.file('extra/'+x.id+'_'+i+'.jpg');if(p)ex.push(new Blob([await p.async('blob')],{type:'image/jpeg'}))}
   await add(m,b,ex);
   have.add(key(x));n++
  }
  toast(t('saved')+' ('+n+')');go(tab)
 }catch(e){toast(t('err')+': '+e.message)}
}

  window.getBlob = k => getB(k);
  window.photoBlobs = async m => {
    const out=[]; const b=await getB(m.id); if(b) out.push(b);
    for(let i=0;i<(m.extra||0);i++){ const p=await getB('p'+m.id+'_'+i); if(p) out.push(p); }
    return out;
  };
  window.getThumb = async (m, blob) => {
    try{
      const url = URL.createObjectURL(blob);
      const v = document.createElement('video');
      v.src = url; v.muted = true; v.playsInline = true; v.preload='metadata';
      await new Promise((r,j)=>{ v.onloadedmetadata=r; v.onerror=j; });
      v.currentTime = Math.min(0.2, (v.duration||1)/3);
      await new Promise(r=>{ v.onseeked=r; });
      const c = document.createElement('canvas');
      c.width = v.videoWidth||640; c.height = v.videoHeight||360;
      c.getContext('2d').drawImage(v,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      const tb = await new Promise(r=>c.toBlob(r,'image/jpeg',.8));
      db.transaction('blobs','readwrite').objectStore('blobs').put(tb,'th'+m.id);
      return tb;
    }catch(e){ return null; }
  };

  window.ask = (title, text, opts) => new Promise(res=>{
    opts = opts || {ok:'موافق', no:'إلغاء'};
    const sh = document.createElement('div'); sh.className='sheet';
    sh.innerHTML = `<div class=sc><h3>${title}</h3>${text?`<p style="text-align:center;color:var(--mute)">${text}</p>`:''}<div style="display:flex;gap:12px;margin-top:18px"><button class=btn style="margin:0" data-y>${opts.ok}</button><button class="btn o" style="margin:0" data-n>${opts.no}</button></div></div>`;
    sh.onclick = e => { if(e.target===sh){sh.remove();res(false)} };
    sh.querySelector('[data-y]').onclick = () => { sh.remove(); res(true); };
    sh.querySelector('[data-n]').onclick = () => { sh.remove(); res(false); };
    document.body.appendChild(sh);
  });

  window.renderStats = async function(){ try{ window.print(); }catch(e){} };

  window.showPreview = function(){
    let s = document.getElementById('saveScreen');
    if(!s){
      s = document.createElement('div');
      s.id='saveScreen'; s.className='screen hidden';
      s.innerHTML = `<header><button class=ib id=saveClose>✕</button><h2>${t('save')}</h2><span></span></header><div id=savePreview></div><div class=paper style="margin-top:14px"><textarea id=saveCaption placeholder="${t('cap')}" style="height:90px;min-height:0"></textarea></div><button class=btn id=saveGo>${t('save')}</button>`;
      document.body.appendChild(s);
      s.querySelector('#saveClose').onclick = () => { hide('saveScreen'); resetPending(); };
      s.querySelector('#saveGo').onclick = async () => {
        if(!S.blob) return;
        const cap = s.querySelector('#saveCaption').value.trim();
        const m = {date:new Date().toISOString(), type:S.type||'photo', caption:cap, favorite:false, mime:S.blob.type||'image/jpeg'};
        try{
          await add(m, S.blob);
          toast(t('saved'));
          hide('saveScreen');
          resetPending();
          go('home');
        }catch(e){ toast(t('err')); }
      };
    }
    const p = s.querySelector('#savePreview');
    p.innerHTML = '';
    if(S.blob){
      const url = URL.createObjectURL(S.blob);
      const img = document.createElement('img');
      img.src = url;
      img.style.cssText = 'width:100%;border-radius:14px;margin-bottom:12px';
      p.appendChild(img);
    }
  };

  window.resetPending = function(){
    S.blob=null; S.photos=[]; S.type=null; S.bg=null; S._fromDraw=false;
    const s = document.getElementById('saveScreen');
    if(s){ const cp = s.querySelector('#saveCaption'); if(cp) cp.value = ''; }
  };
})();

(function(){

  home = async function(){
    await _home.apply(this, arguments);
    const v = document.getElementById('v');
    if(!v || v.querySelector('.lx-home-extra')) return;

    const drawBtn = E('button','row lx-home-extra', `${IC.pen}<b>${t('draw')}</b>`);
    drawBtn.style.animationDelay = '.19s';
    drawBtn.onclick = () => { try{ window.openDraw && window.openDraw(); }catch(e){ toast(t('err')); } };

    const bookBtn = E('button','row lx-home-extra', `${IC.tg}<b>${t('bk_cover')}</b>`);
    bookBtn.style.animationDelay = '.21s';
    bookBtn.onclick = async () => {
      if(!window.luxeBook) return;
      try{ await window.luxeBook(); }catch(e){ console.error(e); toast(t('err')); }
    };

    const stats = v.querySelector('.stats');
    if(stats){ v.insertBefore(drawBtn, stats); v.insertBefore(bookBtn, stats); }
    else { v.append(drawBtn, bookBtn); }
  };
})();

 x.globalCompositeOperation='multiply';x.drawImage(ik,0,0);x.globalCompositeOperation='source-over';
 return toB(c,'image/jpeg',.92);
}
$('lxdN').onclick=async function(){
 if(!strokes.length)return toast(t('dr_empty'),1);
 try{
  var b=await exportB();if(!b)throw 0;
  S.photos=[b];S.blob=b;S.type='photo';S.bg=null;S._fromDraw=true;
  root.classList.add('hidden');showPreview();show('saveScreen');
 }catch(e){toast(t('err'),1)}
};
$('lxdX').onclick=async function(){
 if(strokes.length&&!(await ask(t('dr_discard'),'',{ok:t('ok'),no:t('cancel')})))return;
 root.classList.add('hidden');resetPending();
};

function openLux(){
 strokes=[];redo=[];cur=null;penOnly=false;auto=true;er=false;
 $('lxdTt').textContent=t('draw');$('lxdN').textContent=t('next');
 root.classList.remove('hidden');
 layout();tools();
}
window.addEventListener('resize',function(){if(!root.classList.contains('hidden'))layout()});

/* ✅ تم إصلاح هذا السطر: كان `openDraw=function` بدون window */
window.openDraw=function(){S._act=1;S._viaQ=false;S._oldT=false;S._fromDraw=false;openLux()};
})();
