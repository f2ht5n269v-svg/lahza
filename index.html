<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0F0A08">
<title>لحظة</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Amiri:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0F0A08;--card:#1A1410;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.18);--gold:#D4AF37;--gold-light:#F4D98C;--gold-soft:rgba(212,175,55,.12);--on-gold:#0F0A08;--text:#F5F5F5;--text-2:#D0D0D0;--text-3:#A8A8A8;--text-4:#8A8A8A;--nav:rgba(15,10,8,.96);--veil:rgba(10,6,4,.98);--grad:linear-gradient(135deg,#1F1508,#0F0A08);--shadow:0 4px 20px rgba(0,0,0,.5);--r:14px;--fd:'Reem Kufi',sans-serif;--fb:'IBM Plex Sans Arabic',sans-serif;--fq:'Amiri',serif}
:root[data-theme=light]{color-scheme:light;--bg:#FAF6EE;--card:#FFF;--border:rgba(0,0,0,.1);--border-strong:rgba(0,0,0,.2);--gold:#8B7524;--gold-light:#6A5820;--gold-soft:rgba(139,117,36,.12);--on-gold:#fff;--text:#1A1410;--text-2:#3A3025;--text-3:#5A5045;--text-4:#756B60;--nav:rgba(250,246,238,.96);--veil:rgba(250,246,238,.99);--grad:linear-gradient(135deg,#3a2a12,#1a1410);--shadow:0 4px 20px rgba(0,0,0,.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px;height:100%}html,body{overflow:hidden;background:var(--bg)}body{height:100%;color:var(--text);font:1rem/1.65 var(--fb);display:flex;flex-direction:column}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}input,textarea{font-family:var(--fb);font-size:1rem;outline:none;border:none;background:none;color:inherit}textarea{resize:none}img{display:block;max-width:100%}
.hidden{display:none!important}
@keyframes fi{from{opacity:0}to{opacity:1}}@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.content{flex:1;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top)) 16px 120px;animation:fi .3s}
.page-title{font:600 1.7rem var(--fd);text-align:center;margin-bottom:20px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:100}
.tab{flex:1;padding:12px 0;font-size:.8rem;font-weight:500;color:var(--text-4);display:flex;flex-direction:column;align-items:center;gap:4px}
.tab svg{width:24px;height:24px;stroke-width:1.8;stroke:currentColor;fill:none}
.tab.active{color:var(--gold)}
#splash{position:fixed;inset:0;background:var(--grad);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .8s}
#splash.hide{opacity:0;pointer-events:none}
.splash-logo{font:400 5rem/1 'Great Vibes',cursive;color:var(--gold)}
.home-greeting{font:400 1.25rem var(--fd);color:var(--text-2)}.home-date{font-size:.95rem;color:var(--text-3);margin-bottom:6px}.home-hijri{font:.95rem var(--fd);color:var(--gold);margin-bottom:18px}
.home-action{display:flex;align-items:center;gap:16px;padding:16px 8px;border-bottom:1px solid var(--border);font-size:1.1rem;width:100%;text-align:start}
.home-action svg{width:24px;height:24px;stroke:var(--gold);fill:none}
.home-action .label{flex:1}
.home-stats{margin-top:28px;display:flex;gap:32px;justify-content:center;padding:16px 0;border-block:1px solid var(--border);width:100%}
.home-stat{display:flex;flex-direction:column;align-items:center;gap:4px}.home-stat .num{color:var(--text);font:600 1.6rem/1 var(--fd)}.home-stat .lbl{font-size:.85rem;color:var(--text-3)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .3s}
.sheet-content{width:100%;max-width:480px;background:var(--card);border-radius:28px;border:1px solid var(--border-strong);padding:24px 16px;max-height:85vh;overflow-y:auto;text-align:center;position:relative}
.xbtn{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--border-strong);color:var(--text);font-size:1.15rem;display:flex;align-items:center;justify-content:center}
.btn-close{position:fixed;top:16px;left:16px;z-index:410}
.btn{display:block;width:100%;max-width:360px;margin:10px auto;padding:16px;border:1.5px solid var(--border-strong);border-radius:999px;text-align:center;background:var(--card)}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:600}
.screen{position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;padding:calc(84px + env(safe-area-inset-top)) 16px 120px;animation:fi .3s}
.screen-title{font:500 1.6rem var(--fd);text-align:center;margin-bottom:24px}
.text-input{width:100%;max-width:500px;margin:0 auto 16px;background:var(--card);border:1px solid var(--border-strong);border-radius:var(--r);padding:20px;font:1.15rem/1.9 var(--fq);display:block;color:var(--text);min-height:220px}
.moods{display:flex;justify-content:center;gap:10px;margin:8px 0 4px}.moods button{font-size:1.9rem;width:52px;height:52px;border-radius:50%;border:2px solid transparent;opacity:.65}.moods button.on{border-color:var(--gold);opacity:1}
.modal{position:fixed;inset:0;background:var(--veil);z-index:300;overflow-y:auto;padding:calc(84px + env(safe-area-inset-top)) 8px 130px}
.moments-grid{display:flex;flex-direction:column;gap:24px}
.moment-card{border-radius:var(--r);overflow:hidden;background:var(--card);cursor:pointer;border:1px solid var(--border)}
.moment-card img{width:100%;max-height:70vh;object-fit:contain;background:#000}
.text-content{padding:32px 24px;text-align:center;font:1.2rem/1.9 var(--fq);color:#fff;background:var(--grad)}
.moment-caption{font-size:1rem;color:var(--text-2);padding:10px 16px 0}.moment-meta{display:flex;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--border)}
.filters{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:8px}
.filter-chip{padding:9px 18px;border-radius:999px;border:1px solid var(--border-strong);color:var(--text-3);font-size:.92rem;white-space:nowrap}
.filter-chip.active{background:var(--gold);color:var(--on-gold);font-weight:600}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:999px;background:var(--card);border:1px solid var(--gold);color:var(--gold);z-index:30000;pointer-events:none;text-align:center;transition:opacity .3s}
</style>
</head>
<body>
<div id="toast" class="hidden"></div>
<div id="splash"><div class="splash-logo">Lahza</div></div>
<div class="content" id="tabHome">
  <div class="home-greeting" id="greeting"></div>
  <div class="home-date" id="todayDate"></div>
  <div class="home-hijri" id="hijriDate"></div>
  <div class="home-actions">
    <button class="home-action" id="actionText"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg><span class="label">كتابة</span><span class="arrow">›</span></button>
    <button class="home-action" id="actionPhoto"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg><span class="label">صورة</span><span class="arrow">›</span></button>
    <button class="home-action" id="actionVideo"><svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg><span class="label">فيديو</span><span class="arrow">›</span></button>
    <button class="home-action" id="actionAudio"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg><span class="label">صوت</span><span class="arrow">›</span></button>
    <button class="home-action" id="actionOldDate"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span class="label">تاريخ قديم</span><span class="arrow">›</span></button>
  </div>
  <button class="home-stats" id="homeStats">
    <div class="home-stat"><span class="num" id="streakText">0</span><span class="lbl">يوم متواصل</span></div>
    <div class="home-stat"><span class="num" id="counterText">0</span><span class="lbl">لقطة</span></div>
  </button>
</div>
<div class="content hidden" id="tabMoments">
  <h1 class="page-title">لقطاتي</h1>
  <div id="filterRow" class="filters"></div>
  <div id="momentsGrid" class="moments-grid"></div>
</div>
<div class="content hidden" id="tabSettings">
  <h1 class="page-title">الإعدادات</h1>
  <button class="btn" id="btnExport">تصدير نسخة احتياطية</button>
  <button class="btn" id="btnImport">استيراد نسخة احتياطية</button>
  <input type="file" id="importInput" accept=".zip" hidden>
</div>
<div class="tabs">
  <button class="tab active" id="tabBtnHome"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>الرئيسية</span></button>
  <button class="tab" id="tabBtnMoments"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>لقطاتي</span></button>
  <button class="tab" id="tabBtnSettings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>الإعدادات</span></button>
</div>
<div class="screen hidden" id="photoScreen"><button class="xbtn btn-close" id="photoClose">✕</button><h2 class="screen-title">صورة</h2><video id="photoVideo" autoplay playsinline style="width:100%;border-radius:14px;background:#000"></video><button class="btn primary" id="snapBtn" style="margin-top:16px">التقاط</button><div id="photoStrip" style="display:flex;gap:8px;margin-top:10px;overflow-x:auto"></div><button class="btn primary hidden" id="photoNext" style="margin-top:16px">التالي</button></div>
<div class="screen hidden" id="textScreen"><button class="xbtn btn-close" id="textClose">✕</button><h2 class="screen-title">كتابة</h2><textarea class="text-input" id="textInput"></textarea><button class="btn primary" id="saveTextBtn">حفظ</button></div>
<div class="screen hidden" id="saveScreen"><button class="xbtn btn-close" id="saveClose">✕</button><h2 class="screen-title">حفظ اللقطة</h2><div id="previewWrap"></div><div class="moods" id="moodRow"></div><textarea class="text-input" id="captionInput" placeholder="أضف جملة (اختياري)" style="min-height:80px"></textarea><button class="btn primary" id="saveBtn">حفظ</button></div>
<div class="sheet hidden" id="datePickerSheet"><div class="sheet-content"><button class="xbtn" id="datePickerClose" style="position:absolute;top:10px;left:10px">✕</button><h3>اختر التاريخ</h3><div style="display:flex;gap:8px;margin:20px 0"><select id="pickYear"></select><select id="pickMonth"></select><select id="pickDay"></select></div><button class="btn primary" id="datePickerConfirm">تأكيد</button></div></div>
<div class="sheet hidden" id="typePickerSheet"><div class="sheet-content"><button class="xbtn" id="typePickerClose" style="position:absolute;top:10px;left:10px">✕</button><h3>اختر النوع</h3><button class="btn primary" id="pickTypePhoto">صورة</button><button class="btn primary" id="pickTypeText">كتابة</button></div></div>
<div class="modal hidden" id="momentModal"><button class="xbtn btn-close" id="modalClose">✕</button><div class="modal-content" id="modalContent" style="padding:20px"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const mk = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h) e.innerHTML = h; return e; };
const toastEl = $('#toast');
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.remove('hidden');
  setTimeout(() => toastEl.classList.add('hidden'), 3000);
}

// قاعدة البيانات
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('lahza-db', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('moments')) d.createObjectStore('moments', { keyPath: 'id', autoIncrement: true });
      if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs');
    };
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
}
const getAll = () => new Promise((res) => {
  const req = db.transaction('moments').objectStore('moments').getAll();
  req.onsuccess = () => res(req.result);
});
const getBlob = (id) => new Promise((res) => {
  const req = db.transaction('blobs').objectStore('blobs').get(id);
  req.onsuccess = () => res(req.result);
});
async function addMoment(m, blob) {
  return new Promise((res, rej) => {
    const tx = db.transaction(['moments', 'blobs'], 'readwrite');
    const req = tx.objectStore('moments').add(m);
    req.onsuccess = () => {
      const id = req.result;
      tx.objectStore('blobs').put(blob, id);
      tx.oncomplete = () => res(id);
      tx.onerror = () => rej(tx.error);
    };
  });
}
async function delMoment(id) {
  return new Promise((res) => {
    const tx = db.transaction(['moments', 'blobs'], 'readwrite');
    tx.objectStore('moments').delete(id);
    tx.objectStore('blobs').delete(id);
    tx.oncomplete = () => res();
  });
}

// الحالة
let S = { photos: [], blob: null, type: null, mood: null, oldDate: null };

// التبويبات
function switchTab(name) {
  ['Home', 'Moments', 'Settings'].forEach(x => {
    $('#tabBtn' + x).classList.toggle('active', x === name);
    $('#tab' + x).classList.toggle('hidden', x !== name);
  });
  if (name === 'Home') updateHome();
  if (name === 'Moments') renderMoments();
}
$('#tabBtnHome').onclick = () => switchTab('Home');
$('#tabBtnMoments').onclick = () => switchTab('Moments');
$('#tabBtnSettings').onclick = () => switchTab('Settings');

// الرئيسية
async function updateHome() {
  const d = new Date();
  $('#todayDate').textContent = d.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const h = d.getHours();
  $('#greeting').textContent = (h >= 5 && h < 12) ? 'صباح الخير' : 'مساء الخير';
  
  const ms = await getAll();
  $('#counterText').textContent = ms.length;
  const days = new Set(ms.map(m => new Date(m.date).toDateString()));
  $('#streakText').textContent = days.size;
}

// الكاميرا
async function openCamera() {
  $('#photoScreen').classList.remove('hidden');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    $('#photoVideo').srcObject = stream;
  } catch (e) {
    toast('تعذر فتح الكاميرا');
  }
}
$('#actionPhoto').onclick = () => { S.oldDate = null; S.photos = []; renderStrip(); openCamera(); };
$('#photoClose').onclick = () => {
  const v = $('#photoVideo');
  if (v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
  $('#photoScreen').classList.add('hidden');
  S.photos = []; S.blob = null;
};
$('#snapBtn').onclick = () => {
  const v = $('#photoVideo');
  if (!v.videoWidth) return;
  const cv = document.createElement('canvas');
  cv.width = v.videoWidth; cv.height = v.videoHeight;
  cv.getContext('2d').drawImage(v, 0, 0);
  cv.toBlob(b => { S.photos.push(b); renderStrip(); }, 'image/jpeg', 0.85);
};
function renderStrip() {
  const s = $('#photoStrip'); s.innerHTML = '';
  S.photos.forEach(b => {
    const img = new Image(); img.src = URL.createObjectURL(b); img.style.width = '60px'; img.style.borderRadius = '8px';
    s.appendChild(img);
  });
  $('#photoNext').classList.toggle('hidden', S.photos.length === 0);
}
$('#photoNext').onclick = () => {
  if (!S.photos.length) return;
  $('#photoVideo').srcObject.getTracks().forEach(t => t.stop());
  S.type = 'photo'; S.blob = S.photos[0];
  $('#photoScreen').classList.add('hidden');
  showPreview(); $('#saveScreen').classList.remove('hidden');
};

// الكتابة
$('#actionText').onclick = () => { S.oldDate = null; $('#textInput').value = ''; $('#textScreen').classList.remove('hidden'); };
$('#textClose').onclick = () => $('#textScreen').classList.add('hidden');
$('#saveTextBtn').onclick = () => {
  const txt = $('#textInput').value.trim();
  if (!txt) return toast('اكتب شيئاً أولاً');
  S.blob = new Blob([txt], { type: 'text/plain' });
  S.type = 'text';
  $('#textScreen').classList.add('hidden');
  showPreview(); $('#saveScreen').classList.remove('hidden');
};

// الفيديو والصوت (نسخة سريعة ومستقرة)
$('#actionVideo').onclick = () => {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'video/*';
  i.onchange = () => {
    if (!i.files[0]) return;
    S.blob = i.files[0]; S.type = 'video'; S.oldDate = null;
    showPreview(); $('#saveScreen').classList.remove('hidden');
  };
  i.click();
};
$('#actionAudio').onclick = () => {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'audio/*';
  i.onchange = () => {
    if (!i.files[0]) return;
    S.blob = i.files[0]; S.type = 'audio'; S.oldDate = null;
    showPreview(); $('#saveScreen').classList.remove('hidden');
  };
  i.click();
};

// شاشة الحفظ
function showPreview() {
  const w = $('#previewWrap'); w.innerHTML = '';
  if (S.type === 'photo') {
    const im = new Image(); im.src = URL.createObjectURL(S.blob); im.style.cssText = 'width:100%;border-radius:14px;margin-bottom:12px';
    w.appendChild(im);
  } else if (S.type === 'video' || S.type === 'audio') {
    const el = document.createElement(S.type); el.src = URL.createObjectURL(S.blob); el.controls = true; el.style.cssText = 'width:100%;border-radius:14px;margin-bottom:12px';
    w.appendChild(el);
  } else if (S.type === 'text') {
    S.blob.text().then(t => {
      const d = mk('div', 'text-content', t); d.style.borderRadius = '14px'; d.style.marginBottom = '12px';
      w.appendChild(d);
    });
  }
  paintMoods();
}
function paintMoods() {
  const r = $('#moodRow'); r.innerHTML = '';
  ['😄','🙂','😐','😔','😢'].forEach(e => {
    const b = mk('button', S.mood === e ? 'on' : '', e);
    b.onclick = () => { S.mood = S.mood === e ? null : e; paintMoods(); };
    r.appendChild(b);
  });
}
$('#saveClose').onclick = () => {
  $('#saveScreen').classList.add('hidden');
  $('#captionInput').value = ''; S.blob = null; S.photos = []; S.mood = null;
};
$('#saveBtn').onclick = async () => {
  if (!S.blob) return;
  try {
    const m = { date: (S.oldDate || new Date()).toISOString(), type: S.type, caption: $('#captionInput').value.trim(), favorite: false };
    if (S.mood) m.mood = S.mood;
    if (S.type === 'text') m.txt = await S.blob.text();
    await addMoment(m, S.blob);
    toast('تم الحفظ بنجاح');
    $('#saveScreen').classList.add('hidden');
    $('#captionInput').value = ''; S.blob = null; S.photos = []; S.mood = null;
    switchTab('Home');
  } catch (e) {
    toast('حدث خطأ أثناء الحفظ');
  }
};

// لقطاتي
async function renderMoments() {
  const grid = $('#momentsGrid'); grid.innerHTML = '';
  const ms = (await getAll()).sort((a, b) => new Date(b.date) - new Date(a.date));
  if (!ms.length) { grid.innerHTML = '<div style="text-align:center;color:#888;margin-top:40px;">لا توجد لقطات بعد</div>'; return; }
  
  for (const m of ms) {
    const c = mk('div', 'moment-card');
    const b = await getBlob(m.id);
    if (m.type === 'photo' && b) {
      const im = new Image(); im.src = URL.createObjectURL(b); c.appendChild(im);
    } else if (m.type === 'text' && b) {
      const t = await b.text();
      c.appendChild(mk('div', 'text-content', t));
    } else {
      c.appendChild(mk('div', 'text-content', m.type === 'video' ? '🎥 فيديو' : '🎙 صوت'));
    }
    if (m.caption) c.appendChild(mk('div', 'moment-caption', m.caption));
    const meta = mk('div', 'moment-meta');
    meta.innerHTML = `<span>${m.mood || ''}</span><span>${new Date(m.date).toLocaleDateString('ar-EG')}</span>`;
    c.appendChild(meta);
    c.onclick = () => {
      if (confirm('هل تريد حذف هذه اللقطة؟')) {
        delMoment(m.id).then(() => { toast('تم الحذف'); renderMoments(); });
      }
    };
    grid.appendChild(c);
  }
}

// تاريخ قديم
$('#actionOldDate').onclick = () => {
  const y = $('#pickYear'), m = $('#pickMonth'), d = $('#pickDay');
  y.innerHTML = ''; m.innerHTML = ''; d.innerHTML = '';
  for (let i = new Date().getFullYear(); i >= 1900; i--) y.add(new Option(i, i));
  const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  months.forEach((name, i) => m.add(new Option(name, i + 1)));
  const fillDays = () => {
    d.innerHTML = '';
    const days = new Date(y.value, m.value, 0).getDate();
    for (let i = 1; i <= days; i++) d.add(new Option(i, i));
  };
  y.onchange = fillDays; m.onchange = fillDays; fillDays();
  
  [y, m, d].forEach(sel => { sel.style.cssText = 'flex:1;padding:10px;border-radius:8px;background:var(--bg);color:var(--text);border:1px solid var(--border-strong)'; });
  $('#datePickerSheet').classList.remove('hidden');
};
$('#datePickerClose').onclick = () => $('#datePickerSheet').classList.add('hidden');
$('#datePickerConfirm').onclick = () => {
  S.oldDate = new Date($('#pickYear').value, $('#pickMonth').value - 1, $('#pickDay').value, 12, 0, 0);
  $('#datePickerSheet').classList.add('hidden');
  $('#typePickerSheet').classList.remove('hidden');
};
$('#typePickerClose').onclick = () => $('#typePickerSheet').classList.add('hidden');
$('#pickTypePhoto').onclick = () => { $('#typePickerSheet').classList.add('hidden'); S.photos = []; renderStrip(); openCamera(); };
$('#pickTypeText').onclick = () => {
  $('#typePickerSheet').classList.add('hidden');
  $('#textInput').value = '';
  $('#textScreen').classList.remove('hidden');
};

// الإعدادات (تصدير واستيراد)
$('#btnExport').onclick = async () => {
  const ms = await getAll();
  if (!ms.length) return toast('لا توجد لقطات');
  toast('جاري التصدير...');
  const zip = new JSZip();
  for (const m of ms) {
    const b = await getBlob(m.id);
    if (b) zip.file(`m_${m.id}`, b);
  }
  zip.file('data.json', JSON.stringify(ms));
  const content = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(content); a.download = `lahza-backup-${Date.now()}.zip`;
  a.click();
  toast('تم التصدير');
};

$('#btnImport').onclick = () => $('#importInput').click();
$('#importInput').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const zip = await JSZip.loadAsync(f);
    const data = JSON.parse(await zip.file('data.json').async('string'));
    for (const m of data) {
      const b = zip.file(`m_${m.id}`);
      if (b) {
        const blob = await b.async('blob');
        delete m.id;
        await addMoment(m, blob);
      }
    }
    toast('تم الاستيراد بنجاح');
    switchTab('Home');
  } catch (err) {
    toast('فشل الاستيراد');
  }
};

// التشغيل النهائي
async function startApp() {
  try {
    await openDB();
    updateHome();
  } catch (e) {
    console.error(e);
  }
  setTimeout(() => {
    const sp = $('#splash');
    if (sp) sp.classList.add('hide');
  }, 1500);
}
startApp();
</script>
