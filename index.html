<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0F0A08">
<title>لحظة</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Amiri:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0F0A08;--card:#1A1410;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.18);--gold:#D4AF37;--gold-light:#F4D98C;--gold-soft:rgba(212,175,55,.12);--on-gold:#0F0A08;--text:#F5F5F5;--text-2:#D0D0D0;--text-3:#A8A8A8;--text-4:#8A8A8A;--nav:rgba(15,10,8,.96);--grad:linear-gradient(135deg,#1F1508,#0F0A08);--shadow:0 4px 20px rgba(0,0,0,.5);--r:14px;--fd:'Reem Kufi',sans-serif;--fb:'IBM Plex Sans Arabic',sans-serif;--fq:'Amiri',serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:1rem/1.65 var(--fb);display:flex;flex-direction:column}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:var(--fb);font-size:1rem;outline:none;border:none;background:none;color:inherit;resize:none}
.hidden{display:none!important}
.content{flex:1;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top)) 16px 120px;animation:fi .3s}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:100}
.tab{flex:1;padding:12px 0 10px;font-size:.8rem;font-weight:500;color:var(--text-4);display:flex;flex-direction:column;align-items:center;gap:4px}
.tab svg{width:24px;height:24px;stroke-width:1.8;stroke:currentColor;fill:none}
.tab.active{color:var(--gold)}
#splash{position:fixed;inset:0;background:var(--grad);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .8s;pointer-events:none}
.splash-logo{font:400 5rem/1 'Great Vibes',cursive;color:var(--gold)}
.home-greeting{font:400 1.25rem var(--fd);color:var(--text-2);text-align:center}
.home-date{font-size:.95rem;color:var(--text-3);margin-bottom:32px;text-align:center}
.home-action{display:flex;align-items:center;justify-content:space-between;padding:18px 8px;border-bottom:1px solid var(--border);font-size:1.1rem;width:100%;text-align:start;transition:background .3s}
.home-action:active{background:var(--gold-soft)}
.home-action-left{display:flex;align-items:center;gap:16px}
.home-action svg{width:24px;height:24px;stroke:var(--gold);stroke-width:1.8;fill:none}
.home-stats{margin-top:32px;display:flex;gap:32px;justify-content:center;padding:16px 0;border-block:1px solid var(--border);width:100%;text-align:center}
.home-stat .num{color:var(--text);font:600 1.6rem/1 var(--fd)}
.home-stat .lbl{font-size:.85rem;color:var(--text-3)}
.screen{position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;padding:calc(84px + env(safe-area-inset-top)) 16px 120px;animation:fi .3s}
.screen-title{font:500 1.6rem var(--fd);text-align:center;margin-bottom:24px;color:var(--gold)}
.text-input{width:100%;max-width:500px;margin:0 auto 16px;background:var(--card);border:1px solid var(--border-strong);border-radius:var(--r);padding:20px;font:1.15rem/1.9 var(--fq);display:block;min-height:220px}
.btn{display:block;width:100%;max-width:360px;margin:10px auto;padding:16px;border:1.5px solid var(--border-strong);border-radius:999px;font-weight:500;font-size:1.05rem;text-align:center;background:var(--card)}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:600}
.xbtn{position:fixed;top:calc(16px + env(safe-area-inset-top));left:16px;z-index:210;width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:1.15rem}
.moments-grid{display:flex;flex-direction:column;gap:24px}
.moment-card{border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--border);padding:16px;text-align:start}
.moment-card img{width:100%;border-radius:8px;margin-bottom:10px}
.moment-caption{font-size:1rem;color:var(--text-2);margin-bottom:8px}
.moment-meta{font-size:.85rem;color:var(--text-3);border-top:1px solid var(--border);padding-top:10px;margin-top:10px}
.settings-list{background:var(--card);border-radius:var(--r);border:1px solid var(--border);overflow:hidden}
.settings-item{display:flex;align-items:center;gap:16px;padding:16px;border-bottom:1px solid var(--border);width:100%;text-align:start}
.settings-item:last-child{border:none}
.settings-item .icon svg{width:24px;height:24px;stroke:var(--gold);fill:none}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:999px;background:var(--card);border:1px solid var(--gold);color:var(--gold);z-index:30000;pointer-events:none;text-align:center;transition:opacity .3s}
@keyframes fi{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div id="toast" class="hidden"></div>
<div id="splash"><div class="splash-logo">Lahza</div></div>

<div class="content" id="tabHome">
  <div style="text-align:center;margin-bottom:24px">
    <div style="font:400 2.5rem/1 'Great Vibes',cursive;color:var(--gold);margin-bottom:8px">Lahza</div>
    <div class="home-greeting" id="greeting"></div>
    <div class="home-date" id="todayDate"></div>
  </div>
  <div class="home-actions">
    <button class="home-action" id="actionText">
      <div class="home-action-left"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg><span>كتابة</span></div>
      <svg viewBox="0 0 24 24" style="stroke:var(--text-4)"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button class="home-action" id="actionPhoto">
      <div class="home-action-left"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg><span>صورة</span></div>
      <svg viewBox="0 0 24 24" style="stroke:var(--text-4)"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button class="home-action" id="actionVideo">
      <div class="home-action-left"><svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg><span>فيديو</span></div>
      <svg viewBox="0 0 24 24" style="stroke:var(--text-4)"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button class="home-action" id="actionAudio">
      <div class="home-action-left"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg><span>صوت</span></div>
      <svg viewBox="0 0 24 24" style="stroke:var(--text-4)"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
    <button class="home-action" id="actionOldDate">
      <div class="home-action-left"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>تاريخ قديم</span></div>
      <svg viewBox="0 0 24 24" style="stroke:var(--text-4)"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  <div class="home-stats">
    <div class="home-stat"><span class="num" id="streakText">0</span><span class="lbl">يوم متواصل</span></div>
    <div class="home-stat"><span class="num" id="counterText">0</span><span class="lbl">لقطة</span></div>
  </div>
</div>

<div class="content hidden" id="tabMoments">
  <h1 class="screen-title">لقطاتي</h1>
  <div id="momentsGrid" class="moments-grid"></div>
</div>

<div class="content hidden" id="tabSettings">
  <h1 class="screen-title">الإعدادات</h1>
  <div class="settings-list">
    <button class="settings-item" id="btnExport">
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>
      <span class="label">تصدير نسخة احتياطية</span>
    </button>
    <button class="settings-item" id="btnImport">
      <span class="icon"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span>
      <span class="label">استيراد نسخة احتياطية</span>
    </button>
    <input type="file" id="importInput" accept=".zip" hidden>
  </div>
</div>

<div class="tabs">
  <button class="tab active" id="tabBtnHome"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>الرئيسية</span></button>
  <button class="tab" id="tabBtnMoments"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>لقطاتي</span></button>
  <button class="tab" id="tabBtnSettings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>الإعدادات</span></button>
</div>

<div class="screen hidden" id="photoScreen">
  <button class="xbtn" id="photoClose">✕</button>
  <h2 class="screen-title">صورة</h2>
  <video id="photoVideo" autoplay playsinline muted style="width:100%;border-radius:14px;background:#000;aspect-ratio:3/4;object-fit:cover"></video>
  <button class="btn primary" id="snapBtn" style="margin-top:20px">التقاط</button>
</div>

<div class="screen hidden" id="textScreen">
  <button class="xbtn" id="textClose">✕</button>
  <h2 class="screen-title">كتابة</h2>
  <textarea class="text-input" id="textInput" placeholder="ماذا حدث اليوم؟"></textarea>
  <button class="btn primary" id="saveTextBtn">حفظ</button>
</div>

<div class="screen hidden" id="saveScreen">
  <button class="xbtn" id="saveClose">✕</button>
  <h2 class="screen-title">حفظ اللقطة</h2>
  <div id="previewWrap" style="margin-bottom:16px"></div>
  <button class="btn primary" id="saveBtn">حفظ نهائي</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let S = { blob: null, type: null, oldDate: null, stream: null };

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.add('hidden'), 3000);
}

// قاعدة البيانات
let db;
const req = indexedDB.open('lahza-db', 2);
req.onupgradeneeded = e => {
  let d = e.target.result;
  if(!d.objectStoreNames.contains('moments')) d.createObjectStore('moments', { keyPath: 'id', autoIncrement: true });
  if(!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs');
};
req.onsuccess = e => { db = e.target.result; updateHome(); };
req.onerror = () => toast('خطأ في قاعدة البيانات');

const getAll = () => new Promise(r => { let q = db.transaction('moments').objectStore('moments').getAll(); q.onsuccess = () => r(q.result); });
const getBlob = id => new Promise(r => { let q = db.transaction('blobs').objectStore('blobs').get(id); q.onsuccess = () => r(q.result); });
async function addMoment(m, blob) {
  return new Promise(r => {
    let tx = db.transaction(['moments', 'blobs'], 'readwrite');
    let q = tx.objectStore('moments').add(m);
    q.onsuccess = () => { tx.objectStore('blobs').put(blob, q.result); tx.oncomplete = () => r(); };
  });
}
async function delMoment(id) {
  return new Promise(r => {
    let tx = db.transaction(['moments', 'blobs'], 'readwrite');
    tx.objectStore('moments').delete(id); tx.objectStore('blobs').delete(id);
    tx.oncomplete = () => r();
  });
}

// التبويبات والرئيسية
function switchTab(n) {
  ['Home', 'Moments', 'Settings'].forEach(x => {
    $('tabBtn' + x).classList.toggle('active', x === n);
    $('tab' + x).classList.toggle('hidden', x !== n);
  });
  if (n === 'Home') updateHome();
  if (n === 'Moments') renderMoments();
}
$('tabBtnHome').onclick = () => switchTab('Home');
$('tabBtnMoments').onclick = () => switchTab('Moments');
$('tabBtnSettings').onclick = () => switchTab('Settings');

async function updateHome() {
  $('todayDate').textContent = new Date().toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const h = new Date().getHours();
  $('greeting').textContent = (h >= 5 && h < 12) ? 'صباح الخير' : 'مساء الخير';
  try {
    const ms = await getAll();
    $('counterText').textContent = ms.length;
    const days = new Set(ms.map(m => new Date(m.date).toDateString()));
    let streak = 0, c = new Date();
    while (days.has(c.toDateString())) { streak++; c.setDate(c.getDate() - 1); }
    $('streakText').textContent = streak;
  } catch(e){}
}

// الكاميرا
$('actionPhoto').onclick = async () => {
  S.oldDate = null;
  $('photoScreen').classList.remove('hidden');
  try {
    S.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    $('photoVideo').srcObject = S.stream;
  } catch(e) { toast('تعذر فتح الكاميرا'); }
};
$('photoClose').onclick = () => {
  if(S.stream) S.stream.getTracks().forEach(t => t.stop());
  S.stream = null;
  $('photoScreen').classList.add('hidden');
};
$('snapBtn').onclick = () => {
  const v = $('photoVideo');
  if(!v.videoWidth) return toast('الكاميرا غير جاهزة');
  const cv = document.createElement('canvas');
  cv.width = v.videoWidth; cv.height = v.videoHeight;
  cv.getContext('2d').drawImage(v, 0, 0);
  cv.toBlob(b => {
    S.blob = b; S.type = 'photo';
    if(S.stream) S.stream.getTracks().forEach(t => t.stop());
    S.stream = null;
    $('photoScreen').classList.add('hidden');
    showPreview(); $('saveScreen').classList.remove('hidden');
  }, 'image/jpeg', 0.85);
};

// الفيديو والصوت
$('actionVideo').onclick = () => {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'video/*';
  i.onchange = () => { if(i.files[0]) { S.blob = i.files[0]; S.type = 'video'; S.oldDate = null; showPreview(); $('saveScreen').classList.remove('hidden'); } };
  i.click();
};
$('actionAudio').onclick = () => {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'audio/*';
  i.onchange = () => { if(i.files[0]) { S.blob = i.files[0]; S.type = 'audio'; S.oldDate = null; showPreview(); $('saveScreen').classList.remove('hidden'); } };
  i.click();
};

// الكتابة
$('actionText').onclick = () => { S.oldDate = null; $('textInput').value = ''; $('textScreen').classList.remove('hidden'); };
$('textClose').onclick = () => $('textScreen').classList.add('hidden');
$('saveTextBtn').onclick = () => {
  const txt = $('textInput').value.trim();
  if(!txt) return toast('اكتب شيئاً أولاً');
  S.blob = new Blob([txt], { type: 'text/plain' }); S.type = 'text';
  $('textScreen').classList.add('hidden');
  showPreview(); $('saveScreen').classList.remove('hidden');
};

// الحفظ
function showPreview() {
  const w = $('previewWrap'); w.innerHTML = '';
  if(S.type === 'photo' || S.type === 'video') {
    const el = document.createElement(S.type === 'photo' ? 'img' : 'video');
    el.src = URL.createObjectURL(S.blob);
    if(S.type === 'video') el.controls = true;
    el.style.cssText = 'width:100%;border-radius:14px';
    w.appendChild(el);
  } else if(S.type === 'text') {
    S.blob.text().then(t => { const d = document.createElement('div'); d.className = 'text-input'; d.textContent = t; w.appendChild(d); });
  } else if (S.type === 'audio') {
    const a = document.createElement('audio'); a.src = URL.createObjectURL(S.blob); a.controls = true; w.appendChild(a);
  }
}
$('saveClose').onclick = () => { $('saveScreen').classList.add('hidden'); S.blob = null; S.type = null; };
$('saveBtn').onclick = async () => {
  if(!S.blob) return;
  try {
    await addMoment({ date: (S.oldDate || new Date()).toISOString(), type: S.type }, S.blob);
    toast('تم الحفظ بنجاح'); $('saveClose').click(); switchTab('Home');
  } catch(e) { toast('خطأ في الحفظ'); }
};

// التاريخ القديم (نسخة بسيطة لتعمل فوراً)
$('actionOldDate').onclick = () => {
  const d = prompt('أدخل التاريخ (YYYY-MM-DD):');
  if(!d) return;
  S.oldDate = new Date(d);
  if(isNaN(S.oldDate)) return toast('تاريخ غير صالح');
  $('textScreen').classList.remove('hidden');
};

// عرض اللقطات
async function renderMoments() {
  const grid = $('momentsGrid'); grid.innerHTML = '';
  const ms = (await getAll()).sort((a,b) => new Date(b.date) - new Date(a.date));
  if(!ms.length) { grid.innerHTML = '<div style="text-align:center;color:var(--text-3);margin-top:40px">لا توجد لقطات بعد</div>'; return; }
  
  for(const m of ms) {
    const c = document.createElement('div'); c.className = 'moment-card';
    const b = await getBlob(m.id);
    if(m.type === 'photo' && b) { const im = new Image(); im.src = URL.createObjectURL(b); c.appendChild(im); }
    else if(m.type === 'text' && b) { const p = document.createElement('div'); p.textContent = await b.text(); p.style.cssText = 'font-family:var(--fq);font-size:1.2rem;margin-bottom:10px'; c.appendChild(p); }
    else if(m.type === 'video') { c.innerHTML += '<div style="color:var(--gold);margin-bottom:10px">🎥 فيديو</div>'; }
    else if(m.type === 'audio') { c.innerHTML += '<div style="color:var(--gold);margin-bottom:10px">🎙 صوت</div>'; }
    
    const meta = document.createElement('div'); meta.className = 'moment-meta';
    meta.textContent = new Date(m.date).toLocaleDateString('ar-EG');
    c.appendChild(meta);
    c.onclick = () => { if(confirm('حذف هذه اللقطة؟')) { delMoment(m.id).then(() => { renderMoments(); updateHome(); toast('تم الحذف'); }); } };
    grid.appendChild(c);
  }
}

// النسخ الاحتياطي
$('btnExport').onclick = async () => {
  const ms = await getAll(); if(!ms.length) return toast('لا توجد بيانات');
  toast('جاري التصدير...');
  const zip = new JSZip();
  for(const m of ms) { const b = await getBlob(m.id); if(b) zip.file(`m_${m.id}`, b); }
  zip.file('data.json', JSON.stringify(ms));
  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `lahza-backup.zip`; a.click(); toast('تم التصدير');
};
$('btnImport').onclick = () => $('importInput').click();
$('importInput').onchange = async (e) => {
  const f = e.target.files[0]; if(!f) return;
  try {
    const zip = await JSZip.loadAsync(f);
    const data = JSON.parse(await zip.file('data.json').async('string'));
    for(const m of data) { const b = zip.file(`m_${m.id}`); if(b) { const blob = await b.async('blob'); delete m.id; await addMoment(m, blob); } }
    toast('تم الاستيراد'); updateHome(); renderMoments();
  } catch(err) { toast('فشل الاستيراد'); }
  e.target.value = '';
};

// التشغيل
setTimeout(() => { const sp = $('splash'); if(sp) { sp.style.opacity = '0'; setTimeout(() => sp.style.display = 'none', 800); } }, 1500);
</script>
</body>
</html>
