<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>لحظة</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
:root{--bg:#0a0a0a;--text:#ffffff;--text-dim:#888;--text-faint:#666;--border:#333;--card:#111;--btn-bg:transparent;--btn-text:#ffffff;--btn-primary-bg:#4ade80;--btn-primary-text:#000000;--overlay:rgba(0,0,0,0.95);--shadow:rgba(0,0,0,0.7);}
body{background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;transition:background 0.5s ease,color 0.5s ease;}
.content{flex:1;overflow-y:auto;padding:20px 16px 90px 16px;-webkit-overflow-scrolling:touch;}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:100;transition:background 0.5s ease,border-color 0.5s ease;}
.tab{flex:1;background:none;border:none;color:var(--text-faint);padding:14px 0;font-size:0.75rem;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:color 0.2s;}
.tab.active{color:var(--btn-primary-bg);}
.tab .icon{font-size:1.4rem;}
h1{font-size:1.8rem;font-weight:300;letter-spacing:2px;text-align:center;margin-bottom:6px;color:var(--text);}
.subtitle{color:var(--text-dim);font-size:0.9rem;line-height:1.6;text-align:center;margin-bottom:24px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.btn{display:block;width:100%;max-width:320px;margin:10px auto;padding:18px;border:1px solid var(--border);border-radius:100px;color:var(--btn-text);font-size:1.05rem;text-align:center;transition:all 0.2s;background:var(--btn-bg);}
.btn:active{opacity:0.7;}
.btn.primary{background:var(--btn-primary-bg);color:var(--btn-primary-text);border-color:var(--btn-primary-bg);font-weight:500;}
.btn.small{padding:12px;font-size:0.9rem;max-width:200px;}
.btn.danger{border-color:#ef4444;color:#ef4444;}
video,img.preview{width:100%;max-width:320px;border-radius:16px;margin:16px auto;display:block;background:#000;}
textarea,input[type="text"]{width:100%;max-width:320px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:14px;font-family:inherit;font-size:1rem;margin:8px auto;display:block;resize:none;}
textarea:focus,input:focus{outline:none;border-color:var(--btn-primary-bg);}
.colors{display:flex;justify-content:center;gap:10px;margin:14px 0;flex-wrap:wrap;}
.color-dot{width:36px;height:36px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform 0.2s;}
.color-dot.active{border-color:var(--text);transform:scale(1.1);}
#status{margin-top:14px;color:#4ade80;font-size:0.9rem;min-height:20px;text-align:center;}
.hidden{display:none !important;}
.timeline{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.moment{background:var(--card);border-radius:12px;overflow:hidden;position:relative;aspect-ratio:9/16;cursor:pointer;}
.moment img,.moment video{width:100%;height:100%;object-fit:cover;display:block;position:absolute;top:0;left:0;}
.moment .text-content{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-size:1rem;line-height:1.6;color:#fff;position:absolute;top:0;left:0;}
.moment .bottom-bar{position:absolute;bottom:0;left:0;right:0;z-index:2;background:linear-gradient(to top,var(--shadow),transparent);padding:8px;}
.moment .date{font-size:0.65rem;color:#ddd;text-align:right;}
.moment .caption{font-size:0.7rem;color:#fff;margin-top:2px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.moment .del{position:absolute;top:6px;left:6px;background:rgba(239,68,68,0.9);border:none;color:#fff;width:26px;height:26px;border-radius:50%;font-size:0.9rem;display:flex;align-items:center;justify-content:center;z-index:3;}
.empty{text-align:center;color:var(--text-faint);margin-top:80px;font-size:1rem;line-height:2;}
.counter{text-align:center;color:var(--text-faint);font-size:0.85rem;margin-top:20px;}
.screen-full{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:200;overflow-y:auto;padding:20px 16px 90px 16px;transition:background 0.5s ease;}
.screen-full .close{position:absolute;top:14px;right:14px;font-size:1.6rem;color:var(--text-dim);width:40px;height:40px;display:flex;align-items:center;justify-content:center;}
.screen-full .close:active{color:var(--text);}
#momentModal{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--overlay);z-index:300;overflow-y:auto;padding:50px 20px 40px 20px;display:flex;flex-direction:column;align-items:center;}
#momentModal .close-modal{position:fixed;top:14px;right:14px;font-size:2rem;color:var(--text);width:44px;height:44px;display:flex;align-items:center;justify-content:center;z-index:310;background:rgba(0,0,0,0.5);border-radius:50%;}
#momentModal .modal-content{width:100%;max-width:340px;margin:0 auto;}
#momentModal img,#momentModal video{width:100%;border-radius:16px;background:#000;display:block;margin-bottom:16px;}
#momentModal .modal-text{width:100%;padding:50px 20px;border-radius:16px;font-size:1.3rem;line-height:1.8;text-align:center;margin-bottom:16px;color:#fff;}
#momentModal .modal-date{color:var(--text-dim);font-size:0.9rem;text-align:center;margin-bottom:20px;}
#momentModal .modal-label{color:var(--text-dim);font-size:0.85rem;margin-bottom:6px;display:block;}
#momentModal textarea{max-width:100%;}
#momentModal .modal-actions{display:flex;gap:10px;margin-top:16px;}
#momentModal .modal-actions .btn{max-width:none;flex:1;margin:0;}
.settings-section{background:var(--card);border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid var(--border);}
.settings-title{color:var(--text);font-size:1.1rem;font-weight:500;margin-bottom:16px;display:block;}
.settings-sub{color:var(--text-dim);font-size:0.8rem;margin-bottom:10px;display:block;}
.mode-row{display:flex;gap:10px;margin-bottom:20px;}
.mode-btn{flex:1;padding:14px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--text);font-size:0.9rem;text-align:center;transition:all 0.2s;}
.mode-btn.active{background:var(--btn-primary-bg);color:var(--btn-primary-text);border-color:var(--btn-primary-bg);}
.color-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.color-option{padding:14px;border:2px solid transparent;border-radius:12px;text-align:center;font-size:0.85rem;cursor:pointer;transition:all 0.2s;color:#fff;font-weight:500;}
.color-option.active{border-color:var(--text);transform:scale(1.05);}
.color-option .emoji{display:block;font-size:1.5rem;margin-bottom:4px;}
</style>
</head>
