<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#0F0A08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>لحظة</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Amiri:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0F0A08;--card:#1A1410;--card-hover:#221A15;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.18);--gold:#D4AF37;--gold-light:#F4D98C;--gold-soft:rgba(212,175,55,.12);--on-gold:#0F0A08;--text:#F5F5F5;--text-2:#D0D0D0;--text-3:#A8A8A8;--text-4:#8A8A8A;--nav:rgba(15,10,8,.96);--veil:rgba(10,6,4,.98);--splash:radial-gradient(ellipse at center,#1F1508 0%,#0F0A08 65%);--grad:linear-gradient(135deg,#1F1508,#0F0A08);--shadow:0 4px 20px rgba(0,0,0,.5);--r:14px;--fd:'Reem Kufi',sans-serif;--fb:'IBM Plex Sans Arabic',sans-serif;--fq:'Amiri',serif}
:root[data-theme=light]{color-scheme:light;--bg:#FAF6EE;--card:#FFF;--card-hover:#F5F0E4;--border:rgba(0,0,0,.1);--border-strong:rgba(0,0,0,.2);--gold:#8B7524;--gold-light:#6A5820;--gold-soft:rgba(139,117,36,.12);--on-gold:#fff;--text:#1A1410;--text-2:#3A3025;--text-3:#5A5045;--text-4:#756B60;--nav:rgba(250,246,238,.96);--veil:rgba(250,246,238,.99);--splash:radial-gradient(ellipse at center,#FFF8E6 0%,#FAF6EE 65%);--grad:linear-gradient(135deg,#3a2a12,#1a1410);--shadow:0 4px 20px rgba(0,0,0,.15)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px;height:100%;-webkit-text-size-adjust:100%}
html,body{overflow:hidden;background:var(--bg)}
body{height:100%;color:var(--text);font:1rem/1.65 var(--fb);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:var(--fb);font-size:1rem;outline:none;border:none;background:none;color:inherit}
textarea{resize:none}img{display:block;max-width:100%}a{text-decoration:none;color:inherit}
audio{width:100%}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.04);opacity:.92}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.content{flex:1;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top)) 16px 120px;animation:fi .3s}
.content::-webkit-scrollbar{display:none}
.page-title{font:600 1.7rem var(--fd);text-align:center;margin-bottom:20px;padding-bottom:8px;position:relative}
.page-title::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:40px;height:2px;background:var(--gold);opacity:.6}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--nav);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:100}
.tab{flex:1;padding:12px 0 10px;font-size:.8rem;font-weight:500;color:var(--text-4);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.tab svg{width:24px;height:24px;stroke-width:1.8}
.tab.active{color:var(--gold)}
.tab::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%) scaleX(0);width:28px;height:2px;background:var(--gold);transition:transform .3s}
.tab.active::after{transform:translateX(-50%) scaleX(1)}
#splash{position:fixed;inset:0;background:var(--splash);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .8s;pointer-events:none}
#splash.hide{opacity:0}
.splash-logo{font:400 5rem/1 'Great Vibes',cursive;color:var(--gold);animation:pulse 2.4s infinite}
.splash-sub{color:var(--gold);font:1.2rem var(--fq);margin-top:16px}
.home-greeting{font:400 1.25rem var(--fd);color:var(--text-2)}
.home-date{font-size:.95rem;color:var(--text-3);margin-bottom:6px}
.home-hijri{font:.95rem var(--fd);color:var(--gold);margin-bottom:24px}
.quote-card-title,.hs{display:block;width:100%;margin:22px auto 0;padding:4px 0 0;font:600 1.35rem var(--fd);color:var(--gold);text-align:center;cursor:pointer}
.quote-card-title{margin-top:0}
.quote-card-title::after,.hs::after{content:'';display:block;width:var(--ln,7rem);height:2px;background:var(--gold);margin:8px auto 0}
.hs[data-n]::before{content:attr(data-n);display:inline-block;min-width:1.35em;height:1.35em;padding:0 .3em;border-radius:999px;background:var(--gold);color:var(--on-gold);font:600 .65em/1.35em var(--fb);margin-inline-end:.5em;vertical-align:middle;text-align:center}
#questionCard{display:block;margin:22px auto 0;text-align:center;cursor:pointer}
#dailyQ{display:block;width:fit-content;max-width:92%;margin:14px auto 0;padding-bottom:10px;border-bottom:1px solid var(--gold);text-align:center;font:1.2rem/1.8 var(--fq);color:var(--text)}
.home-actions{margin-top:30px}
.home-action{display:flex;align-items:center;gap:16px;padding:16px 8px;border-bottom:1px solid var(--border);font-size:1.1rem;width:100%;text-align:start}
.home-action:last-child{border:none}
.home-action:active{background:var(--gold-soft)}
.home-action svg,.settings-item .icon svg{width:24px;height:24px;stroke:var(--gold);stroke-width:1.8;fill:none}
.home-action .label{flex:1}
.arrow{color:var(--text-4);font-family:var(--fq);font-size:1.2rem}
.on-this-day{margin:24px auto;max-width:360px;padding:16px;background:var(--card);border:1px solid var(--border-strong);border-radius:var(--r)}
.on-this-day-title{font:1rem var(--fd);color:var(--gold);text-align:center;margin-bottom:8px}
.on-this-day-year{display:flex;justify-content:space-between;padding:10px 16px;margin:4px 0;border:1px solid var(--border);border-radius:10px;width:100%}
.on-this-day-count{font-size:.88rem;color:var(--text-3)}
.home-stats{margin-top:28px;display:flex;gap:32px;justify-content:center;padding:16px 0;border-block:1px solid var(--border);width:100%;color:var(--text-3)}
.home-stat{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:80px}
.home-stat .num{color:var(--text);font:600 1.6rem/1 var(--fd)}
.home-stat .lbl{font-size:.85rem;color:var(--text-3)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:400;display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .3s}
.sheet-content{width:100%;max-width:480px;background:var(--card);color:var(--text);border-radius:28px;border:1px solid var(--border-strong);padding:24px 16px;max-height:85vh;overflow-y:auto;position:relative;box-shadow:0 12px 40px rgba(0,0,0,.6);text-align:center}
.xbtn{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--border-strong);color:var(--text);font-size:1.15rem;display:flex;align-items:center;justify-content:center}
.xbtn:active{color:var(--gold);border-color:var(--gold)}
.sheet-close{position:absolute;top:12px;left:12px;z-index:10}
.btn-close,.modal-close{position:fixed;top:calc(16px + env(safe-area-inset-top));left:16px;z-index:410}
#sectionList{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:28px 0 8px}
#questionList{display:flex;flex-direction:column;gap:10px;padding:16px 0 8px}
.section-item,.question-item{border:1.5px solid var(--border-strong);border-radius:var(--r);background:var(--bg);color:var(--text);padding:16px 8px;min-height:60px}
.section-item{font:500 1.1rem var(--fd)}
.question-item{font:1.1rem/1.7 var(--fq);text-align:start;padding:16px}
.section-item:hover,.question-item:hover{border-color:var(--gold);color:var(--gold)}
.opt{display:block;width:100%;text-align:start;padding:16px;border:1.5px solid var(--border-strong);border-radius:var(--r);margin:8px 0;background:var(--bg);color:var(--text);font:1.1rem/1.7 var(--fq)}
.opt small{display:block;color:var(--text-3);font:.88rem var(--fb);margin-top:4px}
.opt.on{border-color:var(--gold)}
.opt:disabled{opacity:.55}
.btn{display:block;width:100%;max-width:360px;margin:10px auto;padding:16px;border:1.5px solid var(--border-strong);border-radius:999px;font-weight:500;font-size:1.05rem;text-align:center;color:var(--text);background:var(--card)}
.btn:active{transform:scale(.97)}
.btn.sel{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.btn.primary{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:600}
.btn.small{padding:12px;font-size:.95rem;max-width:240px}
.screen{position:fixed;inset:0;background:var(--bg);color:var(--text);z-index:200;overflow-y:auto;padding:calc(84px + env(safe-area-inset-top)) 16px 120px;animation:fi .3s}
.screen-title{font:500 1.6rem var(--fd);text-align:center;margin-bottom:24px}
.screen-subtitle{text-align:center;color:var(--text-3);font-size:.95rem;margin-bottom:20px}
.camera-video{width:100%;max-width:400px;margin:0 auto 16px;border-radius:var(--r);display:block;background:#000;aspect-ratio:3/4;object-fit:cover}
.camera-actions{display:flex;gap:16px;justify-content:center;align-items:center}
.capture-btn{width:76px;height:76px;border-radius:50%;background:var(--gold);border:4px solid var(--border-strong)}
.capture-btn:active{transform:scale(.92)}
.switch-cam{width:52px;height:52px;border-radius:50%;border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:1.4rem}
.strip{display:flex;gap:10px;overflow-x:auto;margin:18px 0 6px;padding:6px 2px;justify-content:center;flex-wrap:wrap}
.strip .th{position:relative;flex-shrink:0}
.strip img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--border-strong)}
.strip .th button{position:absolute;top:-6px;left:-6px;width:26px;height:26px;border-radius:50%;background:#EF4444;color:#fff;font-size:.8rem}
.rec-time{font:600 3.2rem var(--fd);text-align:center;color:var(--gold);margin:28px 0}
.rec-btn{width:100px;height:100px;border-radius:50%;background:var(--gold);margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:2.6rem;color:var(--on-gold)}
.rec-btn.on{background:#EF4444;color:#fff;animation:pulse 1.2s infinite}
.text-input,.answer-input,.search{width:100%;max-width:500px;margin:0 auto 16px;background:var(--card);border:1px solid var(--border-strong);border-radius:var(--r);padding:20px;font:1.15rem/1.9 var(--fq);display:block;color:var(--text)}
.text-input,.answer-input{min-height:220px}
.search{border-radius:999px;padding:12px 20px;font:1rem var(--fb);max-width:none;margin-bottom:8px}
.search-info{text-align:center;color:var(--text-3);font-size:.88rem;margin:0 0 14px;min-height:1.4em}
.text-input:focus,.answer-input:focus,.search:focus{border-color:var(--gold)}
::placeholder{color:var(--text-4);font-family:var(--fb);font-size:1rem}
.background-section{max-width:500px;margin:0 auto 16px}
.background-title{font:.95rem var(--fd);color:var(--text-3);display:block;margin-bottom:8px}
.background-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.bg-option{aspect-ratio:1;border-radius:50%;border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--card);color:var(--text-3);cursor:pointer}
.bg-option img{width:100%;height:100%;object-fit:cover}
.bg-option.active{border-color:var(--gold)}
.bg-option.upload{border-style:dashed;color:var(--gold);font-size:1.6rem}
.moods{display:flex;justify-content:center;gap:10px;margin:8px 0 4px}
.moods button{font-size:1.9rem;width:52px;height:52px;border-radius:50%;border:2px solid transparent;opacity:.65}
.moods button.on{border-color:var(--gold);opacity:1}
.preview{width:100%;max-width:500px;margin:0 auto;padding:48px 24px;border-radius:var(--r);font:1.3rem/1.9 var(--fq);text-align:center;color:#fff;min-height:200px;display:flex;align-items:center;justify-content:center;word-break:break-word;background:var(--grad) center/cover}
.answer-question{max-width:500px;margin:0 auto 24px;padding:24px;background:var(--card);border:1px solid var(--border-strong);border-radius:var(--r);font:1.2rem/1.8 var(--fq);text-align:center;color:var(--gold-light)}
.modal{position:fixed;inset:0;background:var(--veil);color:var(--text);z-index:300;overflow-y:auto;padding:calc(84px + env(safe-area-inset-top)) 8px 130px;animation:fi .3s}
.modal-content img,.modal-content video{width:100%;border-radius:var(--r);margin-bottom:16px;background:#000}
.modal-text{padding:32px 24px;border-radius:var(--r);font:1.3rem/1.9 var(--fq);text-align:center;margin-bottom:16px;color:#fff;word-break:break-word;background:var(--grad) center/cover}
.modal-date{text-align:center;color:var(--gold);font:.95rem var(--fd);margin-bottom:24px;padding:8px 16px;border-radius:999px;background:var(--gold-soft)}
.modal-cap{text-align:center;color:var(--text-2);margin-bottom:16px}
.modal-actions{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 24px;z-index:320;max-width:560px;margin:0 auto;pointer-events:none}
.modal-actions button{pointer-events:auto;width:62px;height:62px;border-radius:50%;background:var(--card);border:1px solid var(--border-strong);font-size:1.5rem;box-shadow:var(--shadow)}
#modalHeart.active{background:#EF4444;border-color:#EF4444;color:#fff}
#modalDelete{color:#EF4444;border-color:rgba(239,68,68,.5)}
.moments-grid{display:flex;flex-direction:column;gap:24px}
.moment-card{border-radius:var(--r);overflow:hidden;background:var(--card);cursor:pointer;border:1px solid var(--border);animation:fu .4s both}
.moment-card img{width:100%;max-height:70vh;object-fit:contain;background:#000}
.vthumb{position:relative;width:100%;aspect-ratio:16/9;background:#111 center/cover no-repeat}
.vthumb::after{content:'▶';position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:1.6rem;display:flex;align-items:center;justify-content:center;padding-inline-start:4px}
.text-content{padding:32px 24px;text-align:center;font:1.2rem/1.9 var(--fq);color:#fff;min-height:160px;display:flex;align-items:center;justify-content:center;word-break:break-word;background:var(--grad) center/cover}
.moment-caption{font-size:1rem;color:var(--text-2);padding:10px 16px 0}
.moment-meta{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid var(--border);min-height:40px}
.moment-time{font:.9rem var(--fd);color:var(--text-3)}
.moment-fav{color:var(--gold);font-size:1.15rem}
.filters{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter-chip{padding:9px 18px;border-radius:999px;border:1px solid var(--border-strong);color:var(--text-3);font-size:.92rem;white-space:nowrap;flex-shrink:0;font-weight:500}
.filter-chip.active{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:600}
.stats-title{font:500 1.6rem var(--fd);text-align:center;margin-bottom:28px;color:var(--gold)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:560px;margin:0 auto}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:24px 16px;text-align:center}
.stat-num{font:600 2.1rem/1 var(--fd);color:var(--gold);display:block;margin-bottom:6px}
.stat-label{color:var(--text-3);font-size:.9rem}
.empty-state{text-align:center;color:var(--text-3);margin-top:70px;line-height:2;padding:24px}
.empty-icon{font-size:3rem;display:block;opacity:.4;color:var(--gold)}
.empty-title{font:500 1.2rem var(--fd);color:var(--text-2)}
.settings-group{margin-bottom:24px}
.settings-group-title{font:500 .85rem var(--fd);letter-spacing:.08em;color:var(--gold);padding:0 8px;margin-bottom:8px}
.settings-list{background:var(--card);border-radius:var(--r);border:1px solid var(--border);overflow:hidden;color:var(--text)}
.settings-item{display:flex;align-items:center;gap:16px;padding:16px;border-bottom:1px solid var(--border);width:100%;text-align:start;min-height:60px;color:var(--text)}
.settings-item:last-child{border:none}
.settings-item:active{background:var(--card-hover)}
.settings-item .icon{width:26px;display:flex;justify-content:center}
.settings-item .info{flex:1;display:flex;flex-direction:column}
.settings-item .value{font-size:.88rem;color:var(--text-3)}
.settings-item.danger .label{color:#EF4444}.settings-item.danger svg{stroke:#EF4444}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:90%;padding:12px 22px;border-radius:999px;background:var(--card);border:1px solid var(--gold);color:var(--gold);font-weight:500;font-size:.95rem;z-index:30000;box-shadow:var(--shadow);pointer-events:none;text-align:center}
#toast.err{border-color:#EF4444;color:#EF4444}
#remBanner{position:fixed;top:0;left:0;right:0;background:var(--card);border-bottom:2px solid var(--gold);padding:calc(14px + env(safe-area-inset-top)) 16px 14px;z-index:9998;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
#onb{position:fixed;inset:0;z-index:25000;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center}
#onb .e{font-size:4.5rem}
#onb h2{font:600 1.8rem var(--fd);color:var(--gold)}
#onb p{color:var(--text-2);max-width:340px}
#onb .dt{display:flex;gap:10px}
#onb .dt i{width:10px;height:10px;border-radius:50%;background:var(--border-strong)}
#onb .dt i.on{background:var(--gold)}
#bookView{position:fixed;inset:0;z-index:50000;background:#fff;color:#111;overflow:auto;padding:24px;font:18px/1.9 var(--fq)}
#bookView .bar{display:flex;gap:10px;margin-bottom:20px}
#bookView .bar button{padding:10px 18px;border-radius:999px;background:#8B7524;color:#fff}
#bookView .e{border-bottom:1px solid #ddd;padding:14px 0;break-inside:avoid}
#bookView .d{color:#8B7524;font-family:var(--fd)}
#bookView img{max-width:100%;max-height:420px;margin-top:8px}
@media print{body>*:not(#bookView){display:none!important}html,body{overflow:visible!important;height:auto!important}#bookView{position:static;overflow:visible}.nop{display:none!important}}
</style>
</head>
<body>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>
<div id="splash"><div class="splash-logo">Lahza</div><div class="splash-sub" data-i18n="app">لحظة</div></div>

<div class="content" id="tabHome">
  <div class="home-greeting" id="greeting"></div>
  <div class="home-date" id="todayDate"></div>
  <div class="home-hijri" id="hijriDate"></div>
  <div id="questionCard" role="button" tabindex="0"><div class="quote-card-title" data-i18n="qod"></div><div id="dailyQ"></div></div>
  <button class="hs" id="moreQ" data-i18n="more_q"></button>
  <button class="hs" id="whispers"><span data-i18n="whisp"></span></button>
  <div class="home-actions">
    <button class="home-action" id="actionPhoto"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg><span class="label" data-i18n="photo"></span><span class="arrow">›</span></button>
    <button class="home-action" id="actionVideo"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg><span class="label" data-i18n="video"></span><span class="arrow">›</span></button>

function toast(msg,isErr){const e=$('toast');e.textContent=msg;e.className=isErr?'err':'';clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add('hidden'),3500)}
const dstr=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdate=d=>{d=new Date(d);return DAYS[S.lang][d.getDay()]+t('sep')+d.getDate()+' '+MON[S.lang][d.getMonth()]+' '+d.getFullYear()};

function showToday(){$('todayDate').textContent=fdate(new Date());$('hijriDate').textContent=hijri();const h=new Date().getHours();$('greeting').textContent=(h>=5&&h<12)?t('gm'):t('ge')}
const show=id=>$(id).classList.remove('hidden'),hide=id=>$(id).classList.add('hidden');

const mimeFor=m=>m.type==='photo'?'image/jpeg':m.type==='video'?(m.mime||'video/mp4'):m.type==='audio'?(m.mime||'audio/mp4'):'text/plain';
function overlay(build){const s=document.createElement('div');s.className='sheet';s.style.zIndex=460;const c=document.createElement('div');c.className='sheet-content';s.appendChild(c);const close=()=>s.remove();build(c,close);s.addEventListener('click',e=>{if(e.target===s)close()});document.body.appendChild(s)}

const M='moments',B='blobs';let db;
const rq=r=>new Promise((s,j)=>{r.onsuccess=()=>s(r.result);r.onerror=()=>j(r.error)});
const txDone=tx=>new Promise((s,j)=>{tx.oncomplete=s;tx.onerror=tx.onabort=()=>j(tx.error)});
function openDB(){return new Promise((s,j)=>{const r=indexedDB.open('lahza-db',2);
  r.onupgradeneeded=()=>{const d=r.result,tx=r.transaction;
    if(!d.objectStoreNames.contains(M))d.createObjectStore(M,{keyPath:'id',autoIncrement:true});
    if(!d.objectStoreNames.contains(B))d.createObjectStore(B);
    tx.objectStore(M).openCursor().onsuccess=ev=>{const c=ev.target.result;if(!c)return;const v=c.value;
      if(v.blob){tx.objectStore(B).put(v.blob,v.id);delete v.blob;c.update(v)}c.continue()}};
  r.onsuccess=()=>{db=r.result;s()};r.onerror=()=>j(r.error)})}
const getAll=()=>rq(db.transaction(M).objectStore(M).getAll());
const getMeta=id=>rq(db.transaction(M).objectStore(M).get(id));
const getBlob=k=>rq(db.transaction(B).objectStore(B).get(k));
const putBlob=(k,b)=>rq(db.transaction(B,'readwrite').objectStore(B).put(b,k));
const upd=m=>rq(db.transaction(M,'readwrite').objectStore(M).put(m));
async function addMoment(m,blob,bg,extras){extras=extras||[];
  const tx=db.transaction([M,B],'readwrite');if(bg)m.bgKey=true;if(extras.length)m.extra=extras.length;
  const id=await rq(tx.objectStore(M).add(m)),bs=tx.objectStore(B);
  bs.put(blob,id);if(bg)bs.put(bg,'bg'+id);extras.forEach((b,i)=>bs.put(b,'p'+id+'_'+i));
  await txDone(tx);return id}
async function delMoment(id){const m=await getMeta(id),tx=db.transaction([M,B],'readwrite'),bs=tx.objectStore(B);
  tx.objectStore(M).delete(id);bs.delete(id);bs.delete('bg'+id);bs.delete('th'+id);for(let i=0;i<((m&&m.extra)||0);i++)bs.delete('p'+id+'_'+i);await txDone(tx)}
async function clearAll(){const tx=db.transaction([M,B],'readwrite');tx.objectStore(M).clear();tx.objectStore(B).clear();await txDone(tx)}
async function backfill(){for(const m of await getAll()){if((m.type==='text'||m.type==='answer')&&m.txt===undefined){const b=await getBlob(m.id);if(b){m.txt=await b.text();await upd(m)}}}}
async function photoBlobs(m){const a=[await getBlob(m.id)];for(let i=0;i<(m.extra||0);i++)a.push(await getBlob('p'+m.id+'_'+i));return a.filter(Boolean)}

/* صور مصغّرة للفيديو (تمنع الشاشة السوداء) */
function videoThumb(blob){return new Promise(res=>{const u=URL.createObjectURL(blob),v=document.createElement('video');let done=false;
  const fin=b=>{if(done)return;done=true;URL.revokeObjectURL(u);v.removeAttribute('src');try{v.load()}catch(e){}res(b)};
  v.muted=true;v.playsInline=true;v.preload='auto';v.setAttribute('playsinline','');
  v.onloadeddata=()=>{try{v.currentTime=Math.min(.5,(v.duration||1)/2)}catch(e){fin(null)}};
  v.onseeked=()=>{try{const w=480,h=Math.round(w*(v.videoHeight||9)/(v.videoWidth||16)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);c.toBlob(b=>fin(b),'image/jpeg',.7)}catch(e){fin(null)}};
  v.onerror=()=>fin(null);setTimeout(()=>fin(null),8000);v.src=u})}
let tq=Promise.resolve();
function getThumb(m,blob){const p=tq.then(async()=>{let th=await getBlob('th'+m.id);if(th)return th;th=await videoThumb(blob);if(th)await putBlob('th'+m.id,th);return th});tq=p.catch(()=>{});return p}

async function updateHome(ms){ms=ms||await getAll();$('counterText').textContent=ms.length;
  const days=new Set(ms.map(m=>dstr(m.date)));let n=0,c=new Date();if(!days.has(dstr(c)))c.setDate(c.getDate()-1);
  while(days.has(dstr(c))){n++;c.setDate(c.getDate()-1)}$('streakText').textContent=n;checkBadges(n)}
async function renderOnThisDay(ms){ms=ms||await getAll();const now=new Date(),mo=now.getMonth(),dy=now.getDate(),yr=now.getFullYear(),ys={};
  ms.forEach(m=>{const d=new Date(m.date);if(d.getMonth()===mo&&d.getDate()===dy&&d.getFullYear()<yr)ys[d.getFullYear()]=(ys[d.getFullYear()]||0)+1});
  const keys=Object.keys(ys).sort((a,b)=>b-a);if(!keys.length){hide('onThisDay');return}
  const box=$('onThisDayYears');box.innerHTML='';
  keys.forEach(y=>{const n=ys[y],b=mk('button','on-this-day-year');
    const s1=mk('span','',y),s2=mk('span','on-this-day-count',n===1?t('one'):n===2?t('two'):n+' '+t('many'));
    b.append(s1,s2);b.onclick=()=>openDay(y+'-'+String(mo+1).padStart(2,'0')+'-'+String(dy).padStart(2,'0'),null);box.appendChild(b)});
  show('onThisDay')}

async function refreshKeep(){const els=[$('dayMomentsScreen'),$('tabMoments'),$('tabHome')],pos=els.map(e=>e.scrollTop);

/* ============ التسجيل الصوتي ============ */
let rec=null,recChunks=[],recT=0,recInt=null,recStream=null;
const pickMime=()=>['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'].find(x=>window.MediaRecorder&&MediaRecorder.isTypeSupported(x))||'';
function killMic(){if(recStream){recStream.getTracks().forEach(x=>x.stop());recStream=null}}
function recUI(st){const b=$('recBtn');b.className='rec-btn'+(st==='rec'?' on':'');b.textContent=st==='rec'?'⏹':'🎙';b.classList.toggle('hidden',st==='done');$('recDone').classList.toggle('hidden',st!=='done')}
async function startRec(){
  try{recStream=await navigator.mediaDevices.getUserMedia({audio:true});const mt=pickMime();rec=new MediaRecorder(recStream,mt?{mimeType:mt}:undefined);recChunks=[];
    rec.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data)};rec.onstop=finishRec;rec.start();
    recT=0;$('recTime').textContent='0:00';recUI('rec');
    recInt=setInterval(()=>{recT++;$('recTime').textContent=fdur(recT);if(recT>=MAXREC)stopRec(false)},1000)}
  catch(e){killMic();toast(t('mic_err'),1)}}
function stopRec(discard){clearInterval(recInt);if(rec&&rec.state!=='inactive'){rec.onstop=discard?null:finishRec;rec.stop()}if(discard){killMic();rec=null}}
function finishRec(){killMic();const type=(rec&&rec.mimeType)||pickMime()||'audio/mp4';S.blob=new Blob(recChunks,{type});S.dur=recT;free(LP);$('recPlayer').src=UP(S.blob);recUI('done')}
function openAudio(){S.blob=null;S.dur=0;$('recTime').textContent='0:00';$('recPlayer').removeAttribute('src');recUI('idle');show('audioScreen')}
$('actionAudio').onclick=()=>{S.oldDate=null;openAudio()};
$('recBtn').onclick=()=>{if(rec&&rec.state==='recording')stopRec(false);else startRec()};
$('recAgain').onclick=()=>{S.blob=null;$('recPlayer').removeAttribute('src');$('recTime').textContent='0:00';recUI('idle')};
$('recNext').onclick=()=>{if(!S.blob)return;S.type='audio';hide('audioScreen');showPreview();show('saveScreen')};
$('audioClose').onclick=()=>{stopRec(true);hide('audioScreen');resetPending()};

function paintMoods(){const r=$('moodRow');r.innerHTML='';MOODS.forEach(e=>{const b=mk('button',S.mood===e?'on':'',e);b.onclick=()=>{S.mood=S.mood===e?null:e;paintMoods()};r.appendChild(b)})}

/* ============ البطاقات ============ */
async function makeCard(m){const card=mk('div','moment-card');card.dataset.id=m.id;let c;
  const b=await getBlob(m.id);
  if(m.type==='photo'){if(!b)return null;c=new Image();c.loading='lazy';c.src=UD(b);card.appendChild(c)}
  else if(m.type==='video'){if(!b)return null;const w=mk('div','vthumb');card.appendChild(w);
    getThumb(m,b).then(th=>{if(th&&w.isConnected)w.style.backgroundImage='url("'+UD(th)+'")'}).catch(()=>{})}
  else if(m.type==='audio'){const w=mk('div');w.style.cssText='padding:22px 16px;text-align:center';
    const h=mk('div','','🎙 '+fdur(m.dur||0));h.style.cssText='font:1.3rem var(--fd);color:var(--gold);margin-bottom:12px';w.appendChild(h);
    if(b){const a=document.createElement('audio');a.controls=true;a.preload='metadata';a.src=UD(b);a.onclick=e=>e.stopPropagation();w.appendChild(a)}card.appendChild(w)}
  else{c=mk('div','text-content',b?await b.text():'');
    if(m.type==='text'){const u=await bgUrl(m,UD);if(u)c.style.background=bgCss(u)+' center/cover'}else c.style.fontSize='1.05rem';card.appendChild(c)}
  if(m.caption&&m.type!=='answer')card.appendChild(mk('div','moment-caption',m.caption));
  const meta=mk('div','moment-meta'),tm=mk('div','moment-time',(m.mood?m.mood+' ':'')+(m.extra?'🖼'+(m.extra+1)+' ':'')+(m.noTime?'':ftime(m.date)));meta.appendChild(tm);
  if(m.favorite)meta.appendChild(mk('span','moment-fav','♥'));
  card.appendChild(meta);card.onclick=()=>openModal(m.id);return card}
function syncFavUI(id,flag){document.querySelectorAll('.moment-card[data-id="'+id+'"]').forEach(card=>{const meta=card.querySelector('.moment-meta'),ex=meta.querySelector('.moment-fav');
  if(flag&&!ex)meta.appendChild(mk('span','moment-fav','♥'));else if(!flag&&ex)ex.remove()})}

/* ============ البحث (كلمات ووسوم وتواريخ) ============ */
const AD={'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
const norm=s=>(s||'').replace(/[٠-٩]/g,c=>AD[c]).toLowerCase();
function hay(m){const d=new Date(m.date),dd=d.getDate(),mo=d.getMonth(),y=d.getFullYear(),p2=n=>String(n).padStart(2,'0');
  const w=[m.caption,m.txt,m.mood,dstr(d),dd+'/'+(mo+1)+'/'+y,p2(dd)+'/'+p2(mo+1)+'/'+y,dd+'-'+(mo+1)+'-'+y,dd+'.'+(mo+1)+'.'+y,(mo+1)+'/'+y,p2(mo+1)+'/'+y,String(y)];
  ['ar','en','sv'].forEach(l=>{w.push(DAYS[l][d.getDay()],dd+' '+MON[l][mo],MON[l][mo]+' '+y,MON[l][mo],I[l][m.type==='answer'?'answers':m.type+'s']||'')});
  return norm(w.join(' '))}
let st;['input','search'].forEach(ev=>$('searchInput').addEventListener(ev,()=>{clearTimeout(st);st=setTimeout(doSearch,250)}));
async function doSearch(){const raw=$('searchInput').value.trim(),r=$('searchResults'),info=$('searchInfo'),seq=++S.seq;
  if(!raw){r.classList.add('hidden');r.innerHTML='';free(LD);show('filterRow');info.textContent=t('search_hint');return renderTree()}
  hide('treeView');hide('empty');hide('filterRow');
  const toks=norm(raw).split(/\s+/).filter(Boolean),ms=await getAll();if(seq!==S.seq)return;
  const f=ms.filter(m=>{const h=hay(m);return toks.every(k=>h.includes(k))}).sort((a,b)=>new Date(b.date)-new Date(a.date));
  info.textContent=f.length?f.length+' '+t('results'):t('nothing');
  free(LD);r.innerHTML='';r.classList.remove('hidden');
  for(const m of f.slice(0,60)){const c=await makeCard(m);if(seq!==S.seq)return;if(c)r.appendChild(c)}}
function renderTags(ms){const c={};
  ms.forEach(m=>{const mt=((m.caption||'')+' '+(m.txt||'')).match(/#[\p{L}\p{N}_]+/gu);if(mt)mt.forEach(x=>{x=x.toLowerCase();c[x]=(c[x]||0)+1})});
  const row=$('tagsRow');row.innerHTML='';
  Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,12).forEach(([tag,n])=>{const b=mk('button','filter-chip',tag+' ('+n+')');b.onclick=()=>{$('searchInput').value=tag;doSearch()};row.appendChild(b)})}

/* ============ الشجرة والتقويم ============ */
async function renderTree(ms){ms=ms||await getAll();renderTags(ms);
  if($('searchInput').value.trim())return doSearch();
  let f=ms;
  if(S.filter==='favorite')f=ms.filter(m=>m.favorite);else if(S.filter!=='all')f=ms.filter(m=>m.type===S.filter);
  S.filtered=f;const ys=[...new Set(f.map(m=>new Date(m.date).getFullYear()))].sort((a,b)=>b-a);
  const row=$('yearsRow');row.innerHTML='';
  if(!ys.length){hide('treeView');show('empty');return}
  show('treeView');hide('empty');
  ys.forEach(y=>{const n=f.filter(m=>new Date(m.date).getFullYear()===y).length,b=mk('button','filter-chip'+(S.year===y?' active':''),y+' ('+n+')');b.onclick=()=>{S.year=y;S.month=S.day=null;renderTree()};row.appendChild(b)});
  if(S.year){show('monthsSection');const g=$('monthsGrid');g.innerHTML='';const now=new Date();
    MON[S.lang].forEach((n,mo)=>{const c=f.filter(m=>{const d=new Date(m.date);return d.getFullYear()===S.year&&d.getMonth()===mo}).length,b=mk('button','filter-chip'+(S.month===mo?' active':''),n+(c?' ('+c+')':''));
      b.style.cssText='padding:10px 4px';if(S.year===now.getFullYear()&&mo===now.getMonth())b.style.borderColor='var(--gold)';
      b.onclick=()=>{S.month=mo;S.day=null;renderTree()};g.appendChild(b)})}
  else hide('monthsSection');
  if(S.year!==null&&S.month!==null){show('calendarSection');renderCalendar()}else hide('calendarSection')}
function renderCalendar(){const y=S.year,mo=S.month,g=$('calendarGrid');g.innerHTML='';$('calTitle').textContent=MON[S.lang][mo]+' '+y;
  const has=new Set(S.filtered.map(m=>dstr(m.date))),today=dstr(new Date()),first=new Date(y,mo,1).getDay(),dim=new Date(y,mo+1,0).getDate();
  for(let i=0;i<first;i++)g.appendChild(document.createElement('div'));
  for(let d=1;d<=dim;d++){const ds=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),el=mk('button','',d);
    el.style.cssText='aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;position:relative;color:var(--text-2)';
    if(ds===S.day){el.style.background='var(--gold)';el.style.color='var(--on-gold)';el.style.fontWeight='600'}
    else if(ds===today){el.style.border='1.5px solid var(--gold)';el.style.color='var(--gold)'}
    else if(has.has(ds)){el.style.background='var(--gold-soft)';el.style.color='var(--text)'}
    if(has.has(ds)&&ds!==S.day){const dot=mk('span');dot.style.cssText='position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--gold)';el.appendChild(dot)}
    el.onclick=()=>{S.day=ds;renderCalendar();openDay(ds,S.filtered)};g.appendChild(el)}}
$('calPrev').onclick=()=>{if(S.month===null)return;S.month--;if(S.month<0){S.month=11;S.year--}S.day=null;renderTree()};
$('calNext').onclick=()=>{if(S.month===null)return;S.month++;if(S.month>11){S.month=0;S.year++}S.day=null;renderTree()};
async function openDay(day,list){S.day=day;if(list!==undefined)S.dayList=list;
  const all=await getAll(),src=(S.dayList===null||S.dayList===undefined)?all:(S.filter==='all'?all:S.filter==='favorite'?all.filter(m=>m.favorite):all.filter(m=>m.type===S.filter));
  const dm=src.filter(m=>dstr(m.date)===day).sort((a,b)=>new Date(a.date)-new Date(b.date));

  else for(const m of dm){const c=await makeCard(m);if(c)g.appendChild(c)}

function closeDay(){hide('dayMomentsScreen');free(LD);$('dayMomentsGrid').innerHTML='';S.day=null;S.dayList=undefined}
$('dayMomentsClose').onclick=()=>{closeDay();if(!$('tabMoments').classList.contains('hidden'))renderTree()};

  else if(m.type==='video'){const v=document.createElement('video');v.src=UM(b);v.controls=true;v.playsInline=true;v.preload='metadata';
    const th=await getBlob('th'+id);if(th)v.poster=UM(th);c.appendChild(v)}
  else if(m.type==='audio'){const w=mk('div','modal-text');w.style.cssText+='display:flex;flex-direction:column;align-items:center;gap:14px';
    const ic=mk('div','','🎙');ic.style.fontSize='3rem';const d=mk('div','',fdur(m.dur||0));d.style.cssText='font:1.3rem var(--fd);color:var(--gold-light)';
    w.append(ic,d);if(b){const a=document.createElement('audio');a.controls=true;a.src=UM(b);w.appendChild(a)}c.appendChild(w)}
  else{const d=mk('div','modal-text');const txt=b?await b.text():'';
    if(m.type==='text'){d.style.minHeight='55vh';d.style.display='flex';d.style.alignItems='center';d.style.justifyContent='center';d.textContent=txt;const u=await bgUrl(m,UM);if(u)d.style.background=bgCss(u)+' center/cover'}
    else{d.style.textAlign='start';const q=mk('div','',m.caption||'');q.style.cssText='color:var(--gold);margin-bottom:16px;font-family:var(--fd);font-size:1.1rem';const a=mk('div','',txt);a.style.fontSize='1.1rem';d.append(q,a)}
    c.appendChild(d)}
  if(m.caption&&m.type!=='answer')c.appendChild(mk('div','modal-cap',m.caption));
  c.appendChild(mk('div','modal-date',(m.mood?m.mood+'  ':'')+fdate(m.date)+(m.noTime?'':' - '+ftime(m.date))));
  const hb=$('modalHeart'),paint=f=>{hb.textContent=f?'♥':'♡';hb.className=f?'active':''};paint(m.favorite);
  hb.onclick=async()=>{const mm=await getMeta(id);if(!mm)return;mm.favorite=!mm.favorite;await upd(mm);paint(mm.favorite);syncFavUI(id,mm.favorite)};
  $('momentModal').scrollTop=0;show('momentModal')}

/* ============ المشاركة (عبر قائمة المشاركة في النظام، بدون أي خادم) ============ */
const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
const isAr=s=>/[\u0600-\u06FF]/.test(s);
function wrapLines(x,txt,maxW){const out=[];txt.split('\n').forEach(par=>{let line='';par.split(' ').forEach(w=>{const s=line?line+' '+w:w;if(line&&x.measureText(s).width>maxW){out.push(line);line=w}else line=s});out.push(line)});return out}
function fitText(x,txt,font,maxW,maxH,max,min){let lines;
  for(let sz=max;sz>=min;sz-=4){x.font=font(sz);lines=wrapLines(x,txt,maxW);if(lines.length*sz*1.55<=maxH)return{sz,lines}}
  const n=Math.max(1,Math.floor(maxH/(min*1.55)));lines=lines.slice(0,n);lines[n-1]=lines[n-1].replace(/\s+\S*$/,'')+'…';return{sz:min,lines}}
function drawLines(x,o,font,color,cx,top){x.font=font(o.sz);x.fillStyle=color;o.lines.forEach((l,i)=>x.fillText(l,cx,top+i*o.sz*1.55))}
async function cardBlob(m,txt){const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  try{await Promise.all([document.fonts.load('60px Amiri'),document.fonts.load('40px "Reem Kufi"'),document.fonts.load('60px "Great Vibes"')])}catch(e){}
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#2a1c0a');g.addColorStop(1,'#0F0A08');x.fillStyle=g;x.fillRect(0,0,W,H);
  if(m.type==='text'){let u=null,own=false;
    if(m.bgKey){const bb=await getBlob('bg'+m.id);if(bb){u=URL.createObjectURL(bb);own=true}}else if(m.background)u=m.background;
    if(u){const im=await loadImg(u);if(own)URL.revokeObjectURL(u);
      if(im){const k=Math.max(W/im.width,H/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);x.fillStyle='rgba(0,0,0,.5)';x.fillRect(0,0,W,H)}}}
  x.textBaseline='top';x.textAlign='center';
  const pad=110,maxW=W-pad*2,cx=W/2;let top=140;
  if(m.type==='answer'&&m.caption){x.direction=isAr(m.caption)?'rtl':'ltr';
    const qf=s=>s+'px "Reem Kufi"',q=fitText(x,m.caption,qf,maxW,300,50,34);drawLines(x,q,qf,'#D4AF37',cx,top);
    top+=q.lines.length*q.sz*1.55+24;x.fillStyle='#D4AF37';x.fillRect(cx-40,top,80,3);top+=48}
  x.direction=isAr(txt)?'rtl':'ltr';
  const bf=s=>s+'px Amiri',availH=(H-280)-top,body=fitText(x,txt,bf,maxW,availH,80,34),bh=body.lines.length*body.sz*1.55;
  if(bh<availH)top+=(availH-bh)/2;
  drawLines(x,body,bf,'#FFFFFF',cx,top);
  x.direction='ltr';x.fillStyle='#D4AF37';x.font='34px "Reem Kufi"';x.fillText(fdate(m.date),cx,H-200);
  x.font='72px "Great Vibes"';x.fillText('Lahza',cx,H-150);
  return new Promise(r=>cv.toBlob(r,'image/png'))}
function dl(file){const u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
async function shareFiles(files,text){
  if(navigator.canShare&&navigator.canShare({files})){try{await navigator.share(text?{files,text}:{files});return}catch(e){if(e.name==='AbortError')return}}
  files.forEach(dl);toast(t('share_saved'))}
async function shareText(txt){
  try{if(navigator.share){await navigator.share({text:txt});return}}catch(e){if(e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(txt);toast(t('share_copied'))}catch(e){toast(t('err'),1)}}

async function buildZip(ms){const zip=new JSZip(),meta=[];
  for(const m of ms){const fn=m.id+'.'+extFor(m),b=await getBlob(m.id);if(b)zip.file('moments/'+fn,b);
    const e={id:m.id,date:m.date,type:m.type,caption:m.caption||'',favorite:!!m.favorite,noTime:!!m.noTime,mood:m.mood||null,mime:m.mime||null,dur:m.dur||0,extra:m.extra||0,section:m.section||null,background:m.background||null,file:fn};
    if(m.bgKey){const bb=await getBlob('bg'+m.id);if(bb){zip.file('bg/'+m.id,bb);e.bgFile='bg/'+m.id}}
    for(let i=0;i<(m.extra||0);i++){const pb=await getBlob('p'+m.id+'_'+i);if(pb)zip.file('extra/'+m.id+'_'+i+'.jpg',pb)}
    meta.push(e)}
  zip.file('data.json',JSON.stringify({version:'9.0',date:new Date().toISOString(),count:ms.length,moments:meta,letters:getL(),gr:LS('lahza-gr')||null},null,2));
  return zip.generateAsync({type:'blob'})}
async function exportZip(ms){toast(t('prep'));const blob=await buildZip(ms),name='lahza-backup-'+dstr(new Date())+'.zip',f=new File([blob],name,{type:'application/zip'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name})}
  else{dl(f)}
  LS('lahza-last-backup',String(Date.now()));toast(t('exp_ok')+' ('+ms.length+')')}
$('btnExport').onclick=async()=>{try{const ms=await getAll();if(!ms.length)return toast(t('no_data'),1);await exportZip(ms)}catch(e){if(e.name!=='AbortError')toast(t('err')+': '+e.message,1)}};

    const key=m=>m.date+'|'+m.type+'|'+(m.caption||''),have=new Set((await getAll()).map(key));let added=0;

      const extras=[];for(let i=0;i<(x.extra||0);i++){const pf=zip.file('extra/'+x.id+'_'+i+'.jpg');if(pf)extras.push(new Blob([await pf.async('blob')],{type:'image/jpeg'}))}

async function prep(m){try{const b=await getBlob(m.id);if(!b)return null;const u=URL.createObjectURL(b);

async function makeVideo(its,o,prog,stop,ac){
  if(!window.MediaRecorder)throw new Error('unsupported');
  const W=540,H=720,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  if(!cv.captureStream)throw new Error('unsupported');
  const x=cv.getContext('2d',{alpha:false});
  try{await Promise.all([document.fonts.load('40px "Reem Kufi"'),document.fonts.load('60px "Great Vibes"')])}catch(e){}
  const stream=cv.captureStream(24),srcs=[];
  if(ac){const dest=ac.createMediaStreamDestination();
    const dec=async b=>{const buf=await b.arrayBuffer();return new Promise((res,rej)=>ac.decodeAudioData(buf,res,rej))};
    const add=async(b,vol,loop)=>{try{const s=ac.createBufferSource();s.buffer=await dec(b);s.loop=loop;const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(dest);srcs.push(s)}catch(e){toast(t('dv_aerr'),1)}};
    if(o.music)await add(o.music,o.voice?0.3:0.9,true);
    if(o.voice)await add(o.voice,1,false);
    dest.stream.getAudioTracks().forEach(tk=>stream.addTrack(tk))}
  const mt=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  const mr=new MediaRecorder(stream,mt?{mimeType:mt,videoBitsPerSecond:1800000}:{videoBitsPerSecond:1800000});
  const chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  const done=new Promise(r=>{mr.onstop=r});
  const frames=(ms,draw)=>new Promise(res=>{const t0=performance.now();const tick=()=>{if(stop()){res();return}const e=performance.now()-t0;draw(e);if(e>=ms)res();else requestAnimationFrame(tick)};tick()});
  const dir=S.lang==='ar'?'rtl':'ltr';
  const bgg=x.createLinearGradient(0,0,W,H);bgg.addColorStop(0,'#2a1c0a');bgg.addColorStop(1,'#0F0A08');
  const shade=x.createLinearGradient(0,H-170,0,H);shade.addColorStop(0,'rgba(0,0,0,0)');shade.addColorStop(1,'rgba(0,0,0,.65)');
  const card=(l1,l2)=>{x.fillStyle=bgg;x.fillRect(0,0,W,H);x.textAlign='center';x.direction=dir;x.fillStyle='#D4AF37';x.font='72px "Great Vibes",cursive';x.fillText('Lahza',W/2,H/2-45);x.font='34px "Reem Kufi",sans-serif';if(l1)x.fillText(l1,W/2,H/2+22);x.fillStyle='#F5F5F5';x.font='24px "Reem Kufi",sans-serif';if(l2)x.fillText(l2,W/2,H/2+66)};
  const frame=(src,sw,sh,m)=>{x.fillStyle='#000';x.fillRect(0,0,W,H);
    if(sw&&sh){const k=Math.max(W/sw,H/sh),w=sw*k,h=sh*k;x.drawImage(src,(W-w)/2,(H-h)/2,w,h)}
    x.fillStyle=shade;x.fillRect(0,H-170,W,170);
    x.textAlign='center';x.direction=dir;x.fillStyle='#fff';x.font='26px "Reem Kufi",sans-serif';x.fillText(fdate(m.date),W/2,H-68);
    x.fillStyle='#D4AF37';x.font='34px "Great Vibes",cursive';x.fillText('Lahza',W/2,H-24)};
  let nxt=null;
  try{
    mr.start(500);srcs.forEach(s=>s.start(0));
    nxt=prep(its[0]);
    await frames(1400,()=>card(o.label,its.length+' '+t('moments')));
    for(let i=0;i<its.length;i++){if(stop())break;
      const cur=await nxt;nxt=i+1<its.length?prep(its[i+1]):null;prog(i,its.length);
      if(!cur)continue;
      try{
        if(cur.k==='p')await frames(o.sec*1000,()=>frame(cur.el,cur.w,cur.h,cur.m));
        else{try{await cur.el.play()}catch(e){}
          await frames(Math.min(o.sec*1000,(isFinite(cur.d)&&cur.d?cur.d:o.sec)*1000),()=>frame(cur.el,cur.w,cur.h,cur.m))}
      }finally{rel(cur)}}
    if(!stop())await frames(1000,()=>card('',''));
  }finally{
    if(nxt)nxt.then(p=>{if(p)rel(p)}).catch(()=>{});
    try{if(mr.state!=='inactive')mr.stop()}catch(e){}
    srcs.forEach(s=>{try{s.stop()}catch(e){}});if(ac){try{ac.close()}catch(e){}}}
  await done;
  try{stream.getTracks().forEach(tk=>tk.stop())}catch(e){}
  if(stop())throw new Error('aborted');
  return new Blob(chunks,{type:mr.mimeType||mt||'video/webm'})}

async function diaryUI(){const all=await getAll();free(LR);D.recording=false;

async function srcOf(m){const b=await getBlob(m.id);if(!b)return null;return m.type==='photo'?b:await getThumb(m,b)}

  const im=new Image();im.style.cssText='width:100%;height:100%;object-fit:cover;display:block';im.draggable=false;if(TC.has(m.id))im.src=TC.get(m.id);b.appendChild(im);

async function composite(){const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  try{await Promise.all([document.fonts.load('40px "Reem Kufi"'),document.fonts.load('40px Amiri'),document.fonts.load('60px "Great Vibes"')])}catch(e){}
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#2a1c0a');g.addColorStop(1,'#0F0A08');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.textBaseline='top';x.textAlign='center';x.fillStyle='#D4AF37';x.font='54px "Reem Kufi"';x.direction=isAr(t('ba_t'))?'rtl':'ltr';x.fillText(t('ba_t'),W/2,50);
  const pw=500,ph=660,gap=20,x0=(W-2*pw-gap)/2,y0=140;
  for(const a of [[0,'b'],[1,'a']]){const i=a[0],w=a[1],m=st[w],px=x0+i*(pw+gap),im=await loadImg(w==='b'?uB:uA);
    x.save();rr(x,px,y0,pw,ph,26);x.clip();
    if(im){const k=Math.max(pw/im.width,ph/im.height);x.drawImage(im,px+(pw-im.width*k)/2,y0+(ph-im.height*k)/2,im.width*k,im.height*k)}
    x.restore();
    const lab=t(w==='b'?'ba_before':'ba_after');x.font='30px "Reem Kufi"';const tw=x.measureText(lab).width+44;
    x.fillStyle=w==='b'?'#E67E22':'#2E8B57';rr(x,px+14,y0+14,tw,48,24);x.fill();
    x.fillStyle='#fff';x.direction=isAr(lab)?'rtl':'ltr';x.fillText(lab,px+14+tw/2,y0+22);
    const ds=fdate(m.date);x.fillStyle='#D4AF37';x.font='28px "Reem Kufi"';x.direction=isAr(ds)?'rtl':'ltr';x.fillText(ds,px+pw/2,y0+ph+24);
    const txt=dayText(m);
    if(txt){x.fillStyle='#F5F5F5';x.font='28px Amiri';x.direction=isAr(txt)?'rtl':'ltr';wrapLines(x,txt,pw-20).slice(0,4).forEach((l,j)=>x.fillText(l,px+pw/2,y0+ph+72+j*40))}}
  x.direction='ltr';x.fillStyle='#D4AF37';x.font='72px "Great Vibes"';x.fillText('Lahza',W/2,H-110);
  return new Promise(r=>cv.toBlob(r,'image/jpeg',.92))}
