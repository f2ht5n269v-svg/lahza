<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lahza Icon</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  .icon {
    width: 100vw;
    height: 100vw;
    max-width: 1024px;
    max-height: 1024px;
    background: radial-gradient(circle at center, #2a0808 0%, #1a0505 60%, #0a0202 100%);
    border-radius: 22.5%;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 60px rgba(201, 169, 97, 0.3);
  }
  .icon-text {
    font-family: 'Great Vibes', cursive;
    font-size: 30vw;
    color: #C9A961;
    text-shadow: 0 0 40px rgba(201, 169, 97, 0.5);
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="icon">
    <div class="icon-text">Lahza</div>
  </div>
</body>
</html>
