<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>أيقونة لحظة</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  body{background:#000;color:#D4AF37;font-family:system-ui;
       min-height:100vh;display:flex;flex-direction:column;
       justify-content:center;align-items:center;gap:24px;padding:20px;margin:0}
  canvas{width:min(85vw,400px);height:min(85vw,400px);border-radius:22.5%}
  button{padding:20px 50px;background:#D4AF37;color:#0F0A08;
         borderه:none;border-radius:99px;بيةfont-size:1.2rem;
 نظ         font-weight:700;cursor:pointer;font-family:inherit}
  button:active{transform:scale(.95)}
  p{color:#D4AF37;text-align:center;font-size:1rem;max-width:400px;line-height:1.7}
</style>
</head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<p>اضغطي الزر → الأيقونة تنزل على فونك<br>باسم <strong>icon.png</strong></p>
<button id="dl">⬇️ حفظ الأيقونة</button>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const S=512,R=256;

async function draw(){
  try{await document.fonts.load('400 200px "Great Vibes"');
      await document.fonts.ready}catch(e){}

  // خلفية سوداء عميقة
  x.fillStyle='#050202';
  x.fillRect(0,0,S,S);

  // النص "Lahza" ذهبي بدون أي توهج
  x.font='400 200px "Great Vibes", cursive';
  x.textAlign='center';x.textBaseline='middle';
  x.fillStyle='#D4AF37';
  x.fillText('Lahza',R,R+8);
}

draw();

document.getElementById('dl').onclick=()=>{
  const a=document.createElement('a');
  a.download='icon.png';
  a.href=c.toDataURL('image/png');
  document.body.appendChild(a);a.click();a.remove();
};
</script>
</body>
</html>
