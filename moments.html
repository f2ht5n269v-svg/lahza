<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لقطاتي - لحظة</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: -apple-system, system-ui, sans-serif;
    padding: 20px;
    min-height: 100vh;
  }
  h1 {
    font-size: 1.6rem;
    font-weight: 300;
    letter-spacing: 1px;
    margin-bottom: 6px;
    text-align: center;
  }
  .count {
    color: #666;
    font-size: 0.85rem;
    text-align: center;
    margin-bottom: 24px;
  }
  .timeline {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .moment {
    background: #111;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 9 / 16;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .moment img, .moment video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    position: absolute;
    top: 0; left: 0;
  }
  .moment .text-content {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 16px;
    font-size: 1.1rem;
    line-height: 1.7;
    color: #fff;
    position: absolute;
    top: 0; left: 0;
  }
  .moment .bottom-bar {
    position: relative;
    z-index: 2;
    background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    padding: 8px;
  }
  .moment .date {
    font-size: 0.7rem;
    color: #ddd;
    text-align: right;
  }
  .moment .caption {
    font-size: 0.75rem;
    color: #fff;
    margin-top: 2px;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .moment .del {
    position: absolute;
    top: 6px;
    left: 6px;
    background: rgba(239,68,68,0.9);
    border: none;
    color: #fff;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-size: 0.9rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }
  .empty {
    text-align: center;
    color: #666;
    margin-top: 60px;
    font-size: 1rem;
    line-height: 2;
  }
  .back {
    display: block;
    margin: 24px auto 0;
    padding: 14px 40px;
    border: 1px solid #333;
    border-radius: 100px;
    background: transparent;
    color: #fff;
    font-size: 1rem;
    text-align: center;
    text-decoration: none;
    width: fit-content;
  }
</style>
</head>
<body>
  <h1>لقطاتي</h1>
  <div class="count" id="count">جاري التحميل...</div>
  <div class="timeline" id="timeline"></div>
  <div class="empty hidden" id="empty">ما في لقطات بعد<br>ارجع للتطبيق وسجّل أول لحظة 📸</div>
  <a href="index.html" class="back">← رجوع للتطبيق</a>

<script>
const DB_NAME = 'lahza-db';
const DB_VERSION = 1;
const STORE_NAME = 'moments';

const timeline = document.getElementById('timeline');
const count = document.getElementById('count');
const empty = document.getElementById('empty');

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

function getAllMoments(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

function deleteMoment(db, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.delete(id);
    req.onsuccess = () => resolve();
    req.onerror = (e) => reject(e.target.error);
  });
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear();
}

async function render() {
  try {
    const db = await openDB();
    const moments = await getAllMoments(db);
    moments.reverse();

    if (moments.length === 0) {
      count.textContent = '';
      empty.classList.remove('hidden');
      return;
    }

    count.textContent = '📸 ' + moments.length + (moments.length === 1 ? ' لقطة' : ' لقطات');

    timeline.innerHTML = '';
    for (const m of moments) {
      const div = document.createElement('div');
      div.className = 'moment';

      if (m.type === 'photo') {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(m.blob);
        div.appendChild(img);
      } else if (m.type === 'video') {
        const video = document.createElement('video');
        video.src = URL.createObjectURL(m.blob);
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.autoplay = true;
        div.appendChild(video);
      } else if (m.type === 'text') {
        const txt = document.createElement('div');
        txt.className = 'text-content';
        txt.style.background = m.color || '#0a0a0a';
        const content = await m.blob.text();
        txt.textContent = content;
        div.appendChild(txt);
      }

      const bar = document.createElement('div');
      bar.className = 'bottom-bar';
      const date = document.createElement('div');
      date.className = 'date';
      date.textContent = formatDate(m.date);
      bar.appendChild(date);
      if (m.caption) {
        const cap = document.createElement('div');
        cap.className = 'caption';
        cap.textContent = m.caption;
        bar.appendChild(cap);
      }
      div.appendChild(bar);

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.onclick = async () => {
        if (confirm('تحذف هاللقطة؟')) {
          await deleteMoment(db, m.id);
          render();
        }
      };
      div.appendChild(del);

      timeline.appendChild(div);
    }
  } catch (err) {
    count.textContent = '❌ خطأ: ' + err.message;
  }
}

render();
</script>
</body>
</html>
